    check_method: cppcheck
    auto_checkable: false
  SWC-C-11-5:
    title: 过程/函数中分配的内存，在过程/函数退出之前要释放。内存释放后，一定要把
    severity: S1
    category: 质量保证
    kind: 规则
    description_cn: 过程/函数中分配的内存，在过程/函数退出之前要释放。内存释放后，一定要把 指针置为NULL。
    check_method: cppcheck
    auto_checkable: false
  SWC-C-11-6:
    title: 过程/函数中申请的（为打开文件而使用的）文件句柄，在过程/函数退出之前要
    severity: S1
    category: 质量保证
    kind: 规则
    description_cn: 过程/函数中申请的（为打开文件而使用的）文件句柄，在过程/函数退出之前要 关闭。 说明：分配的内存不释放以及文件句柄不关闭，是较常见的错误，而且稍不注意就有可能 发生。这类错误往往会引起很严重后果，且难以定位。
      示例：下函数在退出之前，没有把分配的内存释放。 typedef unsigned char BYTE; int example_fun( BYTE gt_len, BYTE *gt_code ) { BYTE *gt_buf;  软件编程规范总则
      9 质量保证 仅供内部使用 64 gt_buf = (BYTE *) malloc (MAX_GT_LENGTH); ... //program code, include check gt_buf if or n
    check_method: cppcheck
    auto_checkable: false
  SWC-C-11-7:
    title: 防止内存操作越界。
    severity: S1
    category: 质量保证
    kind: 规则
    description_cn: '防止内存操作越界。 说明：内存操作主要是指对数组、指针、内存地址等的操作。内存操作越界是软件系统主 要错误之一，后果往往非常严重，所以当我们进行这些操作时一定要仔细小心。 示例：假设某软件系统最多可由10
      个用户同时使用，用户号为1-10，那么如下程序存在 问题。  软件编程规范总则 9 质量保证 仅供内部使用 65 #define MAX_USR_NUM 10 unsigned char usr_login_flg[MAX_USR_NUM]=
      ""; void set_usr_login_flg( unsigned char usr_no ) { if (!usr_login_flg[usr_no]) { us'
    check_method: cppcheck
    auto_checkable: false
  SWC-C-11-8:
    title: 认真处理程序所能遇到的各种出错情况。
    severity: S1
    category: 质量保证
    kind: 规则
    description_cn: 认真处理程序所能遇到的各种出错情况。 说明：switch语句一定要有default语句，多分支if判断一定要有最后的else语句，以保证 所有的情况都能捕捉到。
    check_method: manual_review
    auto_checkable: false
  SWC-C-11-9:
    title: 系统运行之初，要初始化有关变量及运行环境，防止未经初始化的变量被引用。
    severity: S1
    category: 质量保证
    kind: 规则
    description_cn: 系统运行之初，要初始化有关变量及运行环境，防止未经初始化的变量被引用。 说明：尤其要避免编译器不同造成的不同默认初始化值。
    check_method: cppcheck
    auto_checkable: false
  SWC-C-11-10:
    title: 系统运行之初，要对加载到系统中的数据进行一致性检查。
    severity: S1
    category: 质量保证
    kind: 规则
    description_cn: 系统运行之初，要对加载到系统中的数据进行一致性检查。 说明：使用不一致的数据，容易使系统进入混乱状态和不可知状态。
    check_method: manual_review
    auto_checkable: false
  SWC-C-11-11:
