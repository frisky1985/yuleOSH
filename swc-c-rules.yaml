  SWC-C-5-1:
    title: 去掉没必要的公共变量。
    severity: S1
    category: 变量、结构
    kind: 规则
    description_cn: 去掉没必要的公共变量。 说明：公共变量，如全局变量，全局静态变量，局部静态变量等，是增大模块间耦合的原 因之一，故应减少没必要的公共变量以降低模块间的耦合度。跨线程或跨进程使用的公共 变量要考虑并行性问题，往往会变成性能的瓶颈（这里指的是使用信号量等互斥手段引起
      的效率降低）。另外，公共变量对单元测试会产生不良影响，因为使用公共变量的代码正 确性不仅取决于公共变量的变化过程，还取决于以后使用该公共变量的未知代码。
    check_method: manual_review
    auto_checkable: false
