  SWC-C-5-15:
    title: 当声明用于分布式环境或不同CPU间通信环境的数据结构时，必须考虑机器的字节
    severity: S2
    category: 变量、结构
    kind: 建议
    description_cn: '当声明用于分布式环境或不同CPU间通信环境的数据结构时，必须考虑机器的字节 顺序、使用的位域及字节对齐等问题。 说明： 1）字节序问题： 比如Intel CPU 与68360 CPU，在处理位域及整数时，由于大小端序不同，其在内存
      存放的“顺序”正好相反。为了提高代码的移植性，同时又不失去可读性，在结构定义时 使用LITTLE_EDIAN 或BIG_EDIAN 的编译宏进行位域定义。 示例：假如有如下短整数及结构。 unsigned short int exam;
      typedef struct EXAM_BIT_STRU { #ifdef LITTLE_EDIAN /* Intel CPU */ unsigned int RSV: 13; unsigned int A'
    check_method: manual_review
