    severity: S1
    category: 质量保证
    kind: 规则
    description_cn: 严禁随意更改其它模块或系统的有关设置和配置。 说明：编程时，不能随心所欲地更改不属于自己模块的有关设置如常量、数组的大小等。
    check_method: manual_review
