  SWC-C-6-21:
    title: 如果多段代码重复做同一件事情，那么在函数的划分上可能存在问题。
    severity: S2
    category: 函数、过程
    kind: 建议
    description_cn: 如果多段代码重复做同一件事情，那么在函数的划分上可能存在问题。 说明：若此段代码各语句之间有实质性关联并且是完成同一件功能的，那么可考虑把此段 代码构造成一个新的函数。如果多处代码的执行流程一致，只是具体的处理数据有所不同，
      则需要将其抽象为函数。
    check_method: manual_review
    auto_checkable: false
  SWC-C-6-22:
    title: 功能不明确较小的函数，特别是仅有一个上级函数调用它时，应考虑把它合并到
    severity: S2
    category: 函数、过程
    kind: 建议
    description_cn: 功能不明确较小的函数，特别是仅有一个上级函数调用它时，应考虑把它合并到 上级函数中，而不必单独存在。 说明：模块中函数划分的过多，一般会使函数间的接口变得复杂。所以过小的函数，特别 是扇入很低的或功能不明确的函数，不值得单独存在。
    check_method: manual_review
    auto_checkable: false
  SWC-C-6-23:
    title: 设计高扇入、合理扇出（小于7）的函数。
    severity: S2
    category: 函数、过程
    kind: 建议
    description_cn: 设计高扇入、合理扇出（小于7）的函数。 说明：扇出是指一个函数直接调用（控制）其它函数的数目，而扇入是指有多少上级函数  软件编程规范总则 7 可测性 仅供内部使用 48 调用它。 扇出过大，表明函数过分复杂，需要控制和协调过多的下级函数；而扇出过小，如总是1，
      表明函数的调用层次可能过多，这样不利程序阅读和函数结构的分析，并且程序运行时会 对系统资源如堆栈空间等造成压力。函数较合理的扇出（调度函数除外）通常是3-5。扇 出太大，一般是由于缺乏中间层次，可适当增加中间层次的函数。扇出太小，可把下级函
      数进一步分解多个函数，或合并到上级函数中。当然分解或合并函数时，不能改变要实现 的功能，也不能违背函数间的独立性。 扇入越大，表明使用
    check_method: manual_review
    auto_checkable: false
  SWC-C-6-24:
    title: 减少函数本身或函数间的递归调用。
    severity: S2
    category: 函数、过程
    kind: 建议
    description_cn: 减少函数本身或函数间的递归调用。 说明：递归调用特别是函数间的递归调用（如A->B->C->A），影响程序的可理解性；递 归调用一般都占用较多的系统资源（如栈空间）；递归调用对程序的测试有一定影响。故 除非为某些算法或功能的实现方便，应减少没必要的递归调用。
    check_method: manual_review
    auto_checkable: false
  SWC-C-6-25:
