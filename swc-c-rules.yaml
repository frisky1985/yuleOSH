    severity: S1
    category: 质量保证
    kind: 规则
    description_cn: Unix下，多线程的中的子线程退出必需采用主动退出方式，即子线程应return 出口。
    check_method: manual_review
    auto_checkable: false
  SWC-C-11-18:
    title: 不要滥用goto语句。
    severity: S1
    category: 质量保证
    kind: 规则
    description_cn: 不要滥用goto语句。 说明：goto 语句会破坏程序的结构性，所以除非确实需要，最好不使用goto 语句。
    check_method: code_style
    auto_checkable: true
