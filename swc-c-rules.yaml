  SWC-C-11-2:
    title: 代码质量保证优先原则
    severity: S1
    category: 质量保证
    kind: 规则
    description_cn: 代码质量保证优先原则 （1）正确性，指程序要实现设计要求的功能。 （2）稳定性、安全性，指程序稳定、可靠、安全。 （3）全局效率，指软件系统的整体效率。 （4）局部效率，指某个模块/子模块/函数的本身效率。
      （5）可测试性，指程序要具有良好的可测试性。 （6）规范/可读性，指程序书写风格、命名规则等要符合规范。 （7）个人表达方式/个人方便性，指个人编程习惯。
    check_method: manual_review
    auto_checkable: false
  SWC-C-11-3:
    title: 只引用属于自己的存贮空间。
    severity: S1
    category: 质量保证
    kind: 规则
    description_cn: 只引用属于自己的存贮空间。 说明：若模块封装的较好，那么一般不会发生非法引用他人的空间。
    check_method: cppcheck
    auto_checkable: false
  SWC-C-11-4:
    title: 防止引用已经释放的内存空间。
    severity: S1
    category: 质量保证
    kind: 规则
