    description_cn: 尽量不要编写依赖于其他函数内部实现的函数。 说明：此条为函数独立性的基本要求。由于目前大部分高级语言都是结构化的，所以通过 具体语言的语法要求和编译器功能，基本就可以防止这种情况发生。但在汇编语言中，由  软件编程规范总则
