    description_cn: 仔细分析模块的功能及性能需求，并进一步细分，同时若有必要画出有关数据流 图，据此来进行模块的函数划分与组织。 说明：函数的划分与组织是模块的实现过程中很关键的步骤，如何划分出合理的函数结构， 关系到模块的最终效率和可维护性、可测性等。根据模块的功能图或/及数据流图映射出
      函数结构是常用方法之一。
