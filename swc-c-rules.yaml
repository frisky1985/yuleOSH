    title: 在变量和常量之间进行”等于”判断时，把常量写在左边，变量写在右边。
    severity: S1
    category: 质量保证
    kind: 规则
    description_cn: 在变量和常量之间进行”等于”判断时，把常量写在左边，变量写在右边。 说明：可以避免把”==”写成”=”时，变量被赋予不该赋的值。
    check_method: code_style
    auto_checkable: true
  SWC-C-11-1-ADV:
    title: 不使用与硬件或操作系统关系很大的语句，而使用建议的标准语句，以提高软件
    severity: S2
    category: 质量保证
    kind: 建议
    description_cn: 不使用与硬件或操作系统关系很大的语句，而使用建议的标准语句，以提高软件 的可移植性和可重用性。
    check_method: manual_review
    auto_checkable: false
  SWC-C-11-2-ADV:
    title: 除非为了满足特殊需求，避免使用嵌入式汇编。
    severity: S2
    category: 质量保证
    kind: 建议
    description_cn: 除非为了满足特殊需求，避免使用嵌入式汇编。 说明：程序中嵌入式汇编，一般都对可移植性有较大的影响。
    check_method: manual_review
    auto_checkable: false
  SWC-C-11-3-ADV:
    title: 精心地构造、划分子模块，并按“接口”部分及“内核”部分合理地组织子模块，
    severity: S2
    category: 质量保证
    kind: 建议
    description_cn: 精心地构造、划分子模块，并按“接口”部分及“内核”部分合理地组织子模块， 以提高“内核”部分的可移植性和可重用性。 说明：对不同产品中的某个功能相同的模块，若能做到其内核部分完全或基本一致，那么 无论对产品的测试、维护，还是对以后产品的升级都会有很大帮助。
    check_method: cppcheck
    auto_checkable: false
  SWC-C-11-4-ADV:
