    category: 可测性
    kind: 规则
    description_cn: 在同一项目组或产品组内，要有一套统一的为集成测试与系统联调准备的调测开关 及相应打印函数，并且要有详细的说明。 说明：测试与最终发布的版本是通过编译开关的不同来实现的，并且编译开关要规范统一。 统一使用编译开关来实现测试版本和发行版本的区别，一般不允许再定义其他的编译开
      关。
    check_method: manual_review
    auto_checkable: false
  SWC-C-9-2:
    title: 在同一项目组或产品组内，调测打印出的信息串的格式要有统一的形式。信息串中
    severity: S1
    category: 可测性
    kind: 规则
    description_cn: 在同一项目组或产品组内，调测打印出的信息串的格式要有统一的形式。信息串中 至少要有所在模块名（或源文件名）及行号。 说明：统一的调测信息格式便于集成测试。
    check_method: manual_review
    auto_checkable: false
  SWC-C-9-3:
    title: 编程的同时要为单元测试选择恰当的测试点，并仔细构造测试代码、测试用例，同
    severity: S1
    category: 可测性
    kind: 规则
    description_cn: 编程的同时要为单元测试选择恰当的测试点，并仔细构造测试代码、测试用例，同 时给出明确的注释说明。测试代码部分应作为（模块中的）一个子模块，以方便测试代码在模 块中的安装与拆卸（通过调测开关）。 说明：为单元测试而准备。测试代码也是要求写注释的，因为测试代码也是代码，也有后
      续回归测试，也有维护问题。
    check_method: manual_review
    auto_checkable: false
  SWC-C-9-4:
    title: 在进行集成测试/系统联调之前，要构造好测试环境、测试项目及测试用例，同时
    severity: S1
    category: 可测性
    kind: 规则
    description_cn: 在进行集成测试/系统联调之前，要构造好测试环境、测试项目及测试用例，同时 仔细分析并优化测试用例，以提高测试效率。 说明：好的测试用例应尽可能模拟出程序所遇到的边界值、各种复杂环境及一些极端情况 等。
    check_method: manual_review
    auto_checkable: false
  SWC-C-9-5:
    title: 使用断言来发现软件问题，提高代码可测性。
    severity: S1
    category: 可测性
    kind: 规则
    description_cn: '使用断言来发现软件问题，提高代码可测性。 说明：断言是对某种假设条件进行检查（可理解为若条件成立则无动作，否则应报告）， 它可以快速发现并定位软件问题，同时对系统错误进行自动报警。断言可以对在系统中隐
      藏很深，用其它手段极难发现的问题进行定位，从而缩短软件问题定位时间，提高系统的 可测性。实际应用时，可根据具体情况灵活地设计断言。 示例：下面是C 语言中的一个断言，用宏来设计的。（其中NULL 为0L） #ifdef _EXAM_ASSERT_TEST_
      // 若使用断言测试 void exam_assert( char * file_name, unsigned int line_no ) {  软件编程规范总则 7 可测性 仅供内'
    check_method: manual_review
    auto_checkable: false
  SWC-C-9-6:
    title: 用断言来检查程序正常运行时不应发生但在调测时有可能发生的非法情况。
    severity: S1
    category: 可测性
    kind: 规则
    description_cn: 用断言来检查程序正常运行时不应发生但在调测时有可能发生的非法情况。
    check_method: manual_review
    auto_checkable: false
  SWC-C-9-7:
    title: 不能用断言来检查最终产品肯定会出现且必须处理的错误情况。
    severity: S1
    category: 可测性
    kind: 规则
    description_cn: 不能用断言来检查最终产品肯定会出现且必须处理的错误情况。 说明：断言是用来处理不应该发生的错误情况的，对于可能会发生的且必须处理的情况要 写防错程序，而不是断言。如某模块收到其它模块或链路上的消息后，要对消息的合理性
      进行检查，此过程为正常的错误检查，不能用断言来实现。断言只能用于程序内部逻辑的 条件判断，而不能用于对外部输入数据的判断。 示例： Int OnExecMsg（EXEC_MSG *pMsg） { Assert(pMsg); 正确 Assert(EXEC_PROXY
      == pMsg->iServer); 错误 }
    check_method: manual_review
    auto_checkable: false
  SWC-C-9-8:
    title: 对较复杂的断言加上明确的注释。
    severity: S1
    category: 可测性
    kind: 规则
    description_cn: 对较复杂的断言加上明确的注释。 说明：为复杂的断言加注释，可澄清断言含义并减少不必要的误用。
    check_method: manual_review
    auto_checkable: false
  SWC-C-9-9:
    title: 用断言确认函数的参数。
    severity: S1
    category: 可测性
    kind: 规则
    description_cn: 用断言确认函数的参数。  软件编程规范总则 7 可测性 仅供内部使用 55 示例：假设某函数参数中有一个指针，那么使用指针前可对它检查，如下。 int exam_fun( unsigned char *str
      ) { EXAM_ASSERT( str != NULL ); // 用断言检查“假设指针不为空”这个条件 ... //other program code }
    check_method: manual_review
    auto_checkable: false
  SWC-C-9-10:
    title: 用断言保证没有定义的特性或功能不被使用。
    severity: S1
    category: 可测性
    kind: 规则
    description_cn: '用断言保证没有定义的特性或功能不被使用。 示例：假设某通信模块在设计时，准备提供“无连接”和“连接” 这两种业务。但当前 的版本中仅实现了“无连接”业务，且在此版本的正式发行版中，用户（上层模块）不应
      产生“连接”业务的请求，那么在测试时可用断言检查用户是否使用“连接”业务。如下。 #define EXAM_CONNECTIONLESS 0 // 无连接业务 #define EXAM_CONNECTION 1 // 连接业务 int
      msg_process( EXAM_MESSAGE *msg ) { unsigned char service; /* message service class */ EXAM_ASSERT( msg'
    check_method: manual_review
    auto_checkable: false
  SWC-C-9-11:
    title: 用断言对程序开发环境（OS/Compiler/Hardware）的假设进行检查。
    severity: S1
    category: 可测性
    kind: 规则
    description_cn: 用断言对程序开发环境（OS/Compiler/Hardware）的假设进行检查。 说明：程序运行时所需的软硬件环境及配置要求，不能用断言来检查，而必须由一段专门 代码处理。用断言仅可对程序开发环境中的假设及所配置的某版本软硬件是否具有某种功
      能的假设进行检查。如某网卡是否在系统运行环境中配置了，应由程序中正式代码来检查； 而此网卡是否具有某设想的功能，则可由断言来检查。 对编译器提供的功能及特性假设可用断言检查，原因是软件最终产品（即运行代码或机器  软件编程规范总则
      7 可测性 仅供内部使用 56 码）与编译器已没有任何直接关系，即软件运行过程中（注意不是编译过程中）不会也不 应该对编译器的功能提出任何需求。 示例：用断言检查编译器的int 型数据占用的内存空间是否为2，
    check_method: manual_review
    auto_checkable: false
  SWC-C-9-12:
    title: 正式软件产品中应把断言及其它调测代码去掉（即把有关的调测开关关掉）。
    severity: S1
    category: 可测性
    kind: 规则
    description_cn: 正式软件产品中应把断言及其它调测代码去掉（即把有关的调测开关关掉）。 说明：加快软件运行速度。
    check_method: manual_review
    auto_checkable: false
  SWC-C-9-13:
    title: 在软件系统中设置与取消有关测试手段，不能对软件实现的功能等产生影响。
    severity: S1
    category: 可测性
    kind: 规则
    description_cn: 在软件系统中设置与取消有关测试手段，不能对软件实现的功能等产生影响。 说明：即有测试代码的软件和关掉测试代码的软件，在功能行为上应一致。
    check_method: manual_review
    auto_checkable: false
  SWC-C-9-14:
    title: 用调测开关来切换软件的DEBUG版和正式版，而不要同时存在正式版本和DEBUG
    severity: S1
    category: 可测性
    kind: 规则
    description_cn: 用调测开关来切换软件的DEBUG版和正式版，而不要同时存在正式版本和DEBUG 版本的不同源文件，以减少维护的难度。
    check_method: manual_review
    auto_checkable: false
  SWC-C-9-15:
    title: 软件的DEBUG版本和发行版本应该统一维护，不允许分家，并且要时刻注意保证
    severity: S1
    category: 可测性
    kind: 规则
    description_cn: 软件的DEBUG版本和发行版本应该统一维护，不允许分家，并且要时刻注意保证 两个版本在实现功能上的一致性。
    check_method: manual_review
    auto_checkable: false
  SWC-C-9-1-ADV:
    title: 在编写代码之前，应预先设计好程序调试与测试的方法和手段，并设计好各种调测
    severity: S2
    category: 可测性
    kind: 建议
    description_cn: 在编写代码之前，应预先设计好程序调试与测试的方法和手段，并设计好各种调测 开关及相应测试代码如打印函数等。 说明：程序的调试与测试是软件生存周期中很重要的一个阶段，如何对软件进行较全面、 高率的测试并尽可能地找出软件中的错误就成为很关键的问题。因此在编写源代码之前，
      除了要有一套比较完善的测试计划外，还应设计出一系列代码测试手段，为单元测试、集 成测试及系统联调提供方便。打印函数要采用统一的打印格式，打印的目的是为了能迅速 准确分析和定位问题。
    check_method: manual_review
    auto_checkable: false
  SWC-C-9-2-ADV:
    title: 调测开关应分为不同级别和类型。
    severity: S2
    category: 可测性
    kind: 建议
    description_cn: 调测开关应分为不同级别和类型。 说明：调测开关的设置及分类应从以下几方面考虑：针对模块或系统某部分代码的调测； 针对模块或系统某功能的调测；出于某种其它目的，如对性能、容量等的测试。这样做便 于软件功能的调测，并且便于模块的单元测试、系统联调等。
    check_method: manual_review
    auto_checkable: false
  SWC-C-9-3-ADV:
    title: 编写防错程序，然后在处理错误之后可用断言宣布发生错误。
    severity: S2
    category: 可测性
    kind: 建议
    description_cn: '编写防错程序，然后在处理错误之后可用断言宣布发生错误。 示例：假如某模块收到通信链路上的消息，则应对消息的合法性进行检查，若消息类别不 是通信协议中规定的，则应进行出错处理，之后可用断言报告，如下例。
      #ifdef _EXAM_ASSERT_TEST_ // 若使用断言测试  软件编程规范总则 7 可测性 仅供内部使用 57 /* Notice: this function does not call ''abort'' to exit
      program */ void assert_report( char * file_name, unsigned int line_no ) { printf( "\n[EXAM]Error Report: %s,'
    check_method: manual_review
    auto_checkable: false
  SWC-C-10-1:
    title: 编程时要经常注意代码的效率。
    severity: S1
    category: 程序效率
    kind: 规则
    description_cn: 编程时要经常注意代码的效率。 说明：代码效率分为全局效率、局部效率、时间效率及空间效率。全局效率是站在整个系 统的角度上的系统效率；局部效率是站在模块或函数角度上的效率；时间效率是程序处理 输入任务所需的时间长短；空间效率是程序所需内存空间，如机器代码空间大小、数据空
      间大小、栈空间大小等。
    check_method: manual_review
    auto_checkable: false
  SWC-C-10-2:
    title: 在保证软件系统的正确性、稳定性、可读性及可测性的前提下，提高代码效率。
    severity: S1
    category: 程序效率
    kind: 规则
    description_cn: 在保证软件系统的正确性、稳定性、可读性及可测性的前提下，提高代码效率。 说明：不能一味地追求代码效率，而对软件的正确性、稳定性、可读性及可测性造成影响。
    check_method: manual_review
    auto_checkable: false
  SWC-C-10-3:
    title: 局部效率应为全局效率服务，不能因为提高局部效率而对全局效率造成影响。
    severity: S1
    category: 程序效率
    kind: 规则
    description_cn: 局部效率应为全局效率服务，不能因为提高局部效率而对全局效率造成影响。
    check_method: manual_review
    auto_checkable: false
  SWC-C-10-4:
    title: 通过对系统数据结构的划分与组织的改进，以及对程序算法的优化来提高空间效
    severity: S1
    category: 程序效率
    kind: 规则
    description_cn: 通过对系统数据结构的划分与组织的改进，以及对程序算法的优化来提高空间效 率。 说明：这种方式是解决软件空间效率的根本办法。 示例：如下记录学生学习成绩的结构不合理。 typedef unsigned char
      BYTE; typedef unsigned short WORD; typedef struct STUDENT_SCORE_STRU BYTE name[8]; BYTE age; BYTE sex; BYTE class; BYTE
      subject; float score; } STUDENT_SCORE; 因为每位学生都有多科学习成绩，故如上结构将占用较大空间。应如下改进（分为两个结 构），总的存贮空间将变小，操作也变得更方便。 typedef s
    check_method: manual_review
    auto_checkable: false
  SWC-C-10-5:
    title: 循环体内工作量最小化。
    severity: S1
    category: 程序效率
    kind: 规则
    description_cn: 循环体内工作量最小化。 说明：应仔细考虑循环体内的语句是否可以放在循环体之外，使循环体内工作量最小，从 而提高程序的时间效率。 示例：如下代码效率不高。 for (ind = 0; ind < MAX_ADD_NUMBER;
      ind++) { sum += ind; back_sum = sum; /* backup sum */ } 语句“back_sum = sum;”完全可以放在for 语句之后，如下。 for (ind = 0; ind < MAX_ADD_NUMBER;
      ind++) { sum += ind; } back_sum = sum; /* backup sum */
    check_method: manual_review
    auto_checkable: false
  SWC-C-10-6:
    title: 中断服务程序是影响系统实时性的关键部分，所以应该尽可能短，可以不在中断
    severity: S1
    category: 程序效率
    kind: 规则
    description_cn: 中断服务程序是影响系统实时性的关键部分，所以应该尽可能短，可以不在中断 服务程序中做的事情一定要拿到外面来做，保证中断能及时退出。
    check_method: manual_review
    auto_checkable: false
  SWC-C-10-1-ADV:
    title: 仔细分析有关算法，并进行优化。
    severity: S2
    category: 程序效率
    kind: 建议
    description_cn: 仔细分析有关算法，并进行优化。  软件编程规范总则 8 程序效率 仅供内部使用 60
    check_method: manual_review
    auto_checkable: false
  SWC-C-10-2-ADV:
    title: 仔细考查、分析系统及模块处理输入（如事务、消息等）的方式，并加以改进。
    severity: S2
    category: 程序效率
    kind: 建议
    description_cn: 仔细考查、分析系统及模块处理输入（如事务、消息等）的方式，并加以改进。
    check_method: manual_review
    auto_checkable: false
  SWC-C-10-3-ADV:
    title: 对模块中函数的划分及组织方式进行分析、优化，改进模块中函数的组织结构，
    severity: S2
    category: 程序效率
    kind: 建议
    description_cn: 对模块中函数的划分及组织方式进行分析、优化，改进模块中函数的组织结构， 提高程序效率。 说明：软件系统的效率主要与算法、处理任务方式、系统功能及函数结构有很大关系，仅 在代码上下功夫一般不能解决根本问题。
    check_method: manual_review
    auto_checkable: false
  SWC-C-10-4-ADV:
    title: 编程时，要随时留心代码效率；优化代码时，要考虑周全。
    severity: S2
    category: 程序效率
    kind: 建议
    description_cn: 编程时，要随时留心代码效率；优化代码时，要考虑周全。
    check_method: manual_review
    auto_checkable: false
  SWC-C-10-5-ADV:
    title: 不应花过多的时间拼命地提高调用不很频繁的函数代码效率。
    severity: S2
    category: 程序效率
    kind: 建议
    description_cn: 不应花过多的时间拼命地提高调用不很频繁的函数代码效率。 说明：对代码优化可提高效率，但若考虑不周很有可能引起严重后果。
    check_method: manual_review
    auto_checkable: false
  SWC-C-10-6-ADV:
    title: 要仔细地构造或直接用汇编编写调用频繁或性能要求极高的函数。
    severity: S2
    category: 程序效率
    kind: 建议
    description_cn: 要仔细地构造或直接用汇编编写调用频繁或性能要求极高的函数。 说明：只有对编译系统产生机器码的方式以及硬件系统较为熟悉时，才可使用汇编嵌入方 式。嵌入汇编可提高时间及空间效率，但也存在一定风险。
    check_method: manual_review
    auto_checkable: false
  SWC-C-10-7:
    title: 在保证程序质量的前提下，通过压缩代码量、去掉不必要代码以及减少不必要的
    severity: S2
    category: 程序效率
    kind: 建议
    description_cn: 在保证程序质量的前提下，通过压缩代码量、去掉不必要代码以及减少不必要的 局部和全局变量，来提高空间效率。 说明：这种方式对提高空间效率可起到一定作用，但往往不能解决根本问题。
    check_method: manual_review
    auto_checkable: false
  SWC-C-10-8:
    title: 在多重循环中，应将最忙的循环放在最内层。
    severity: S2
    category: 程序效率
    kind: 建议
    description_cn: 在多重循环中，应将最忙的循环放在最内层。 说明：减少CPU 切入循环层的次数。 示例：如下代码效率不高。 for (row = 0; row < 100; row++) { for (col = 0; col
      < 5; col++) { sum += a[row][col]; } } 可以改为如下方式，以提高效率。 for (col = 0; col < 5; col++) { for (row = 0; row < 100; row++)
      {  软件编程规范总则 8 程序效率 仅供内部使用 61 sum += a[row][col]; } }
    check_method: manual_review
    auto_checkable: false
  SWC-C-10-9:
