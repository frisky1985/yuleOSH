    severity: S2
    category: 质量保证
    kind: 建议
    description_cn: 资源文件（多语言版本支持），如果资源是对语言敏感的，应让该资源与源代码 文件脱离，具体方法有下面几种：使用单独的资源文件、DLL文件或其它单独的描述文件（如 数据库格式） 说明：日志，界面显示等，是禁止直接写成“硬”代码的，必须统一规划到资源文件或
