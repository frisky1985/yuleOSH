      示例：Add_User 不允许，add_user、AddUser、m_AddUser 允许。 说明：建议统一使用驼峰式+匈牙利命名法。 补充：在变量声明过程中，建议增加模块信息为前缀（或者namespace），以避免项目庞 大后出现重名编译错误现象。
