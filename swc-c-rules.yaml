    category: 变量、结构
    kind: 规则
    description_cn: 仔细定义并明确公共变量的含义、作用、取值范围及公共变量间的关系。 说明：在对变量声明的同时，应对其含义、作用及取值范围进行注释说明，同时若有必要 还应说明与其它变量的关系。
