  SWC-C-12-3-ADV:
    title: 要小心地使用编辑器提供的块拷贝功能编程。
    severity: S2
    category: 代码编辑、编译、审查
    kind: 建议
    description_cn: 要小心地使用编辑器提供的块拷贝功能编程。 说明：当某段代码与另一段代码的处理功能相似时，许多开发人员都用编辑器提供的块拷 贝功能来完成这段代码的编写。由于程序功能相近，故所使用的变量、采用的表达式等在 功能及命名上可能都很相近，所以使用块拷贝时要注意，除了修改相应的程序外，一定要
      把使用的每个变量仔细查看一遍，以改成正确的。不应指望编译器能查出所有这种错误， 比如当使用的是全局变量时，就有可能使某种错误隐藏下来。
    check_method: manual_review
    auto_checkable: false
