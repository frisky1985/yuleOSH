    description_cn: 编写可重入函数时，应注意局部变量的使用（如编写C/C++语言的可重入函数时， 应使用auto即缺省态局部变量或寄存器变量）。 说明：编写C/C++语言的可重入函数时，不应使用static 局部变量，否则必须经过特殊
      处理，才能使函数具有可重入性。
    check_method: manual_review
    auto_checkable: false
  SWC-C-6-4:
    title: 编写可重入函数时，若使用全局变量，则应通过关中断、信号量（即P、V操作）
    severity: S1
    category: 函数、过程
    kind: 规则
    description_cn: 编写可重入函数时，若使用全局变量，则应通过关中断、信号量（即P、V操作） 等手段对其加以保护。 说明：若对所使用的全局变量不加以保护，则此函数就不具有可重入性，即当多个进程调 用此函数时，很有可能使有关全局变量变为不可知状态。
      示例：假设Exam 是int 型全局变量，函数Squre_Exam 返回Exam 平方值。那么如下 函数不具有可重入性。 unsigned int example( int para ) { unsigned int temp; Exam
      = para; // （**） temp = Square_Exam( ); return temp; } 此函数若被多个进程调用的话，其结果可能是未知的，因为当（**）语句刚执行完后，另 外一个使用本函数
    check_method: manual_review
    auto_checkable: false
