  SWC-C-12-5:
    title: 某些语句经编译后产生告警，但如果你认为它是正确的，那么应通过某种手段去
    severity: S2
    category: 代码编辑、编译、审查
    kind: 建议
    description_cn: '某些语句经编译后产生告警，但如果你认为它是正确的，那么应通过某种手段去 掉告警信息。 说明：在Borland C/C++中，可用“#pragma warn”来关掉或打开某些告警。 示例： #pragma
      warn -rvl // 关闭告警 int examples_fun( void ) { // 程序，但无return 语句。 } #pragma warn +rvl // 打开告警 编译函数examples_fun 时本应产生“函数应有返回值”告警，但由于关掉了此告警信
      息显示，所以编译时将不会产生此告警提示。'
