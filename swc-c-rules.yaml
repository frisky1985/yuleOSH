    auto_checkable: false
  SWC-C-6-26:
    title: 改进模块中函数的结构，降低函数间的耦合度，并提高函数的独立性以及代码可
    severity: S2
    category: 函数、过程
    kind: 建议
    description_cn: 改进模块中函数的结构，降低函数间的耦合度，并提高函数的独立性以及代码可 读性、效率和可维护性。优化函数结构时，要遵守以下原则： （1）不能影响模块功能的实现。 （2）仔细考查模块或函数出错处理及模块的性能要求并进行完善。
      （3）通过分解或合并函数来改进软件结构。 （4）考查函数的规模，过大的要进行分解。 （5）降低函数间接口的复杂度。 （6）不同层次的函数调用要有较合理的扇入、扇出。 （7）函数功能应可预测。 （8）提高函数内聚。（单一功能的函数内聚最高）  软件编程规范总则
      7 可测性 仅供内部使用 49 说明：对初步划分后的函数结构应进行改进、优化，使之更为合理。
    check_method: manual_review
    auto_checkable: false
  SWC-C-6-27:
    title: 在多任务操作系统的环境下编程，要注意函数可重入性的构造。
    severity: S2
    category: 函数、过程
    kind: 建议
    description_cn: 在多任务操作系统的环境下编程，要注意函数可重入性的构造。 说明：可重入性是指函数可以被多个任务进程调用。在多任务操作系统中，函数是否具有 可重入性是非常重要的，因为这是多个进程可以共用此函数的必要条件。另外，编译器是
      否提供可重入函数库，与它所服务的操作系统有关，只有操作系统是多任务时，编译器才 有可能提供可重入函数库。如DOS 下BC 和MSC 等就不具备可重入函数库，因为DOS 是 单用户单任务操作系统。
    check_method: manual_review
    auto_checkable: false
