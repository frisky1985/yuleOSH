  SWC-C-11-12:
    title: 不能随意改变与其它模块的接口。
    severity: S1
    category: 质量保证
    kind: 规则
    description_cn: 不能随意改变与其它模块的接口。  软件编程规范总则 9 质量保证 仅供内部使用 66
    check_method: manual_review
    auto_checkable: false
