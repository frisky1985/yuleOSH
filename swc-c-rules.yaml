    kind: 规则
    description_cn: 充分了解系统的接口之后，再使用系统提供的功能。 示例：在B 型机的各模块与操作系统的接口函数中，有一个要由各模块负责编写的初始化 过程，此过程在软件系统加载完成后，由操作系统发送的初始化消息来调度。因此就涉及
      到初始化消息的类型与消息发送的顺序问题，特别是消息顺序，若没搞清楚就开始编程， 很容易引起严重后果。以下示例引自B 型曾出现过的实际代码，其中使用了 FID_FETCH_DATA 与FID_INITIAL 初始化消息类型，注意B 型机的系统是在
      FID_FETCH_DATA 之前发送FID_INITIAL 的。 MID alarm_module_list[MAX_ALARM_MID]; int FAR SYS_ALARM_proc(
    check_method: manual_review
    auto_checkable: false
  SWC-C-11-14:
    title: 编程时，要防止差1错误。
    severity: S1
    category: 质量保证
    kind: 规则
    description_cn: 编程时，要防止差1错误。 说明：此类错误一般是由于把“<=”误写成“<”或“>=”误写成“>”等造成的，由此 引起的后果，很多情况下是很严重的，所以编程时，一定要在这些地方小心。当编完程序 后，应对这些操作符进行彻底检查。
    check_method: code_style
    auto_checkable: true
  SWC-C-11-15:
    title: 要时刻注意易混淆的操作符。当编完程序后，应从头至尾检查一遍这些操作符，
    severity: S1
    category: 质量保证
    kind: 规则
    description_cn: 要时刻注意易混淆的操作符。当编完程序后，应从头至尾检查一遍这些操作符， 以防止拼写错误。 说明：形式相近的操作符最容易引起误用，如C/C++中的“=”与“==”、“|”与“||”、 “&”与“&&”等，若拼写错了，编译器不一定能够检查出来。
      示例：如把“&”写成“&&”，或反之。 ret_flg = (pmsg->ret_flg & RETURN_MASK); 被写为： ret_flg = (pmsg->ret_flg && RETURN_MASK);  软件编程规范总则
      9 质量保证 仅供内部使用 68 rpt_flg = (VALID_TASK_NO( taskno ) && DATA_NOT_ZERO( stat_data )); 被写为： rpt_flg
    check_method: cppcheck
    auto_checkable: false
  SWC-C-11-16:
    title: 有可能的话，if语句尽量加上else分支，对没有else分支的语句要小心对待；
    severity: S1
    category: 质量保证
    kind: 规则
    description_cn: 有可能的话，if语句尽量加上else分支，对没有else分支的语句要小心对待； switch语句必须有default分支。
    check_method: code_style
    auto_checkable: true
