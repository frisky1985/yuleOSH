    kind: 建议
    description_cn: 尽量减少循环嵌套层次。
    check_method: manual_review
    auto_checkable: false
  SWC-C-10-10:
    title: 避免循环体内含判断语句，应将循环语句置于判断语句的代码块之中。
    severity: S2
    category: 程序效率
    kind: 建议
    description_cn: 避免循环体内含判断语句，应将循环语句置于判断语句的代码块之中。 说明：目的是减少判断次数。循环体中的判断语句是否可以移到循环体外，要视程序的具 体情况而言，一般情况，与循环变量无关的判断语句可以移到循环体外，而有关的则不可
      以。 示例：如下代码效率稍低。 for (ind = 0; ind < MAX_RECT_NUMBER; ind++) { if (data_type == RECT_AREA) { area_sum += rect_area[ind];
      } else { rect_length_sum += rect[ind].length; rect_width_sum += rect[ind].width; } } 因为判断语句与循环变量无关，故
    check_method: manual_review
    auto_checkable: false
  SWC-C-10-11:
    title: 尽量用乘法或其它方法代替除法，特别是浮点运算中的除法。
    severity: S2
    category: 程序效率
    kind: 建议
    description_cn: '尽量用乘法或其它方法代替除法，特别是浮点运算中的除法。 说明：浮点运算除法要占用较多CPU 资源。 示例：如下表达式运算可能要占较多CPU 资源。 #define PAI 3.1416 radius =
      circle_length / (2 * PAI); 应如下把浮点除法改为浮点乘法。 #define PAI_RECIPROCAL (1 / 3.1416 ) // 编译器编译时，将生成具体浮点数 radius = circle_length
      * PAI_RECIPROCAL / 2;'
    check_method: manual_review
    auto_checkable: false
  SWC-C-10-12:
    title: 不要一味追求紧凑的代码。
    severity: S2
    category: 程序效率
    kind: 建议
    description_cn: 不要一味追求紧凑的代码。 说明：因为紧凑的代码并不代表高效的机器码，反而会影响可读性。
    check_method: manual_review
    auto_checkable: false
  SWC-C-10-13:
    title: 要提高程序的时间效率，应从调用最频繁的函数入手进行优化。如果有冗余代码，
    severity: S2
    category: 程序效率
