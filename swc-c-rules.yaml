    severity: S1
    category: 变量、结构
    kind: 规则
    description_cn: 明确公共变量与操作此公共变量的函数或过程的关系，如访问、修改及创建等。 说明：明确过程操作变量的关系后，将有利于程序的进一步优化、单元测试、系统联调以 及代码维护等。这种关系的说明可在注释或文档中描述。
      示例：在源文件中，可按如下注释形式说明。 RELATION System_Init Input_Rec Print_Rec Stat_Score Student Create Modify Access Access Score Create
      Modify Access Access, Modify 注：RELATION 为操作关系；System_Init、Input_Rec、Print_Rec、Stat_Score 为四个不同的函数；Student、Score
    check_method: manual_review
