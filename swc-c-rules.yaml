    severity: S2
    category: 质量保证
    kind: 建议
    description_cn: 为用户提供良好的接口界面，使用户能较充分地了解系统内部运行状态及有关系 统出错情况。
    check_method: cppcheck
    auto_checkable: false
  SWC-C-11-10-ADV:
