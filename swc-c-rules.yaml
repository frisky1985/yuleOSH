    severity: S2
    category: 质量保证
    kind: 建议
    description_cn: 精心构造算法，并对其性能、效率进行测试。
    check_method: cppcheck
    auto_checkable: false
  SWC-C-11-5-ADV:
    title: 对较关键的算法最好使用其它算法来确认。
    severity: S2
    category: 质量保证
    kind: 建议
    description_cn: 对较关键的算法最好使用其它算法来确认。
    check_method: cppcheck
    auto_checkable: false
  SWC-C-11-6-ADV:
    title: 时刻注意表达式是否会上溢、下溢。
    severity: S2
    category: 质量保证
    kind: 建议
    description_cn: 时刻注意表达式是否会上溢、下溢。 示例：如下程序将造成变量下溢。 unsigned char size ; while (size-- >= 0) // 将出现下溢 {  软件编程规范总则 9 质量保证
      仅供内部使用 69 ... // program code } 当size 等于0 时，再减1 不会小于0，而是0xFF，故程序是一个死循环。应如下修改。 char size; // 从unsigned char 改为char while
      (size-- >= 0) { ... // program code }
    check_method: cppcheck
    auto_checkable: false
  SWC-C-11-7-ADV:
    title: 使用变量时要注意其边界值的情况。
    severity: S2
    category: 质量保证
    kind: 建议
    description_cn: 使用变量时要注意其边界值的情况。 示例：如C 语言中字符型变量，有效值范围为-128 到127。故以下表达式的计算存在一 定风险。 char chr = 127; int sum = 200; chr +=
      1; // 127 为chr 的边界值，再加1 将使chr 上溢到-128，而不是128。 sum += chr; // 故sum 的结果不是328，而是72。 若chr 与sum 为同一种类型，或表达式按如下方式书写，可能会好些。
      sum = sum + chr + 1;
    check_method: cppcheck
    auto_checkable: false
  SWC-C-11-8-ADV:
