      示例：下函数的实现不太好。 void sum_data( unsigned int num, int *data, int *sum ) { unsigned int count; *sum = 0;  软件编程规范总则 7 可测性
      仅供内部使用 42 for (count = 0; count < num; count++) { *sum += data[count]; // sum 成了工作变量，不太好。 }
