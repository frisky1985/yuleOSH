    severity: S2
    category: 质量保证
    kind: 建议
    description_cn: 系统应具有一定的容错能力，对一些错误事件（如用户误操作等）能进行自动补 救。
    check_method: manual_review
    auto_checkable: false
  SWC-C-11-11-ADV:
    title: 对一些具有危险性的操作代码（如写硬盘、删数据等）要仔细考虑，防止对数据、
    severity: S2
    category: 质量保证
    kind: 建议
    description_cn: 对一些具有危险性的操作代码（如写硬盘、删数据等）要仔细考虑，防止对数据、 硬件等的安全构成危害，以提高系统的安全性。
    check_method: manual_review
    auto_checkable: false
  SWC-C-11-12-ADV:
    title: 使用第三方提供的软件开发工具包或控件时，要注意以下几点：
    severity: S2
    category: 质量保证
    kind: 建议
    description_cn: 使用第三方提供的软件开发工具包或控件时，要注意以下几点： （1）充分了解应用接口、使用环境及使用时注意事项。  软件编程规范总则 9 质量保证 仅供内部使用 70 （2）不能过分相信其正确性。 （3）除非必要，不要使用不熟悉的第三方工具包与控件。
      说明：使用工具包与控件，可加快程序开发速度，节省时间，但使用之前一定对它有较充 分的了解，同时第三方工具包与控件也有可能存在问题。
    check_method: manual_review
    auto_checkable: false
  SWC-C-11-13-ADV:
