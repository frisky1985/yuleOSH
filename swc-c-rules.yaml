    auto_checkable: false
  SWC-C-6-6:
    title: 在同一项目组应明确规定对接口函数参数的合法性检查应由函数的调用者负责还是
    severity: S1
    category: 函数、过程
    kind: 规则
    description_cn: 在同一项目组应明确规定对接口函数参数的合法性检查应由函数的调用者负责还是 由接口函数本身负责，缺省是由函数调用者负责。 说明：对于模块间接口函数的参数的合法性检查这一问题，往往有两个极端现象，即：要 么是调用者和被调用者对参数均不作合法性检查，结果就是遗漏了合法性检查这一必要的
      处理过程，造成问题隐患；要么就是调用者和被调用者均对参数进行合法性检查，这种情 况虽不会造成问题，但产生了冗余代码，降低了效率。 可以确定这样的原则：如果一个函数仅在内部使用，可由函数调用者或者接口函数负责参 数合法性检查。如果函数是对外接口的函数，是给外界来调用或者直接处理外部传来的数
      据，则必须有函数本身来检查传入的参数是否有效，以保证函数的容错能力，典型的例子， 如API，COM 接口
    check_method: manual_review
    auto_checkable: false
