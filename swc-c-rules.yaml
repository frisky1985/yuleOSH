    description_cn: 防止把没有关联的语句放到一个函数中。 说明：防止函数或过程内出现随机内聚。随机内聚是指将没有关联或关联很弱的语句放到 同一个函数或过程中。随机内聚给函数或过程的维护、测试及以后的升级等造成了不便， 同时也使函数或过程的功能不明确。使用随机内聚函数，常常容易出现在一种应用场合需
      要改进此函数，而另一种应用场合又不允许这种改进，从而陷入困境。 在编程时，经常遇到在不同函数中使用相同的代码，许多开发人员都愿把这些代码提出来， 并构成一个新函数。若这些代码关联较大并且是完成一个功能的，那么这种构造是合理的， 否则这种构造将产生随机内聚的函数。
