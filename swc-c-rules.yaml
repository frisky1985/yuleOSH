meta:
  standard: SWC (软件编程规范)
  language: C
  version: '0.3'
  ruleset_version: 0.3.0
  rules_total: 218
  source: 软件编程规范_v0.3.pdf (zlm)
  auto_checkable_count: 32
rules:
  SWC-C-1-1:
    title: 程序块要采用缩进风格编写，缩进的空格数为4个。
    severity: S1
    category: 排版
    kind: 规则
    description_cn: 程序块要采用缩进风格编写，缩进的空格数为4个。 说明：对于由开发工具自动生成的代码可以有不一致。对编译开关和宏定义不做要求。
    check_method: code_style
    auto_checkable: true
  SWC-C-1-2:
    title: 相对独立的程序块之间、变量说明之后必须加空行。
    severity: S1
    category: 排版
    kind: 规则
    description_cn: 相对独立的程序块之间、变量说明之后必须加空行。 示例：如下例子不符合规范。 if (!valid_ni(ni)) { ... // program code } repssn_ind = ssn_data[index].repssn_index;
      repssn_ni = ssn_data[index].ni; 应如下书写 if (!valid_ni(ni)) { ... // program code } repssn_ind = ssn_data[index].repssn_index;
      repssn_ni = ssn_data[index].ni;
    check_method: code_style
    auto_checkable: true
  SWC-C-1-3:
    title: 较长的语句（>80字符）要分成多行书写，长表达式要在低优先级操作符处划分新
    severity: S1
    category: 排版
    kind: 规则
    description_cn: 较长的语句（>80字符）要分成多行书写，长表达式要在低优先级操作符处划分新 行，操作符放在新行之首，划分出的新行要进行适当的缩进，使排版整齐，语句可读。适当缩 进对齐方式以“=”对齐，其他不做要求 示例：
      perm_count_msg.head.len = NO7_TO_STAT_PERM_COUNT_LEN + STAT_SIZE_PER_FRAM * sizeof(_UL); act_task_table[frame_id * STAT_TASK_CHECK_NUMBER
      + index].occupied = stat_poi[index].occupied; act_task_table[taskno].duration_true_or_false = SYS
    check_method: code_style
    auto_checkable: true
  SWC-C-1-4:
    title: 循环、判断等语句中若有较长的表达式或语句，则要进行适应的划分，长表达式要
    severity: S1
    category: 排版
    kind: 规则
    description_cn: 循环、判断等语句中若有较长的表达式或语句，则要进行适应的划分，长表达式要 在低优先级操作符处划分新行，操作符放在新行之首。 示例： if ((taskno < max_act_task_number) &&
      (n7stat_stat_item_valid (stat_item))) { ... // program code } for (i = 0, j = 0; (i < BufferKeyword[word_index].word_length)
      && (j < NewKeyword.word_length); i++, j++) { ... // program code } for (i = 0, j = 0; (i < first_word_length
    check_method: code_style
    auto_checkable: true
  SWC-C-1-5:
    title: 若函数或过程中的参数较长，则要进行适当的划分。参数划分时，需要适当缩进。
    severity: S1
    category: 排版
    kind: 规则
    description_cn: 若函数或过程中的参数较长，则要进行适当的划分。参数划分时，需要适当缩进。 示例： n7stat_str_compare((BYTE *) & stat_object, (BYTE *) & (act_task_table[taskno].stat_object),
      sizeof (_STAT_OBJECT)); n7stat_flash_act_duration( stat_item, frame_id *STAT_TASK_CHECK_NUMBER + index, stat_object
      );
    check_method: code_style
    auto_checkable: true
  SWC-C-1-6:
    title: 不允许把多个短语句写在一行中，即一行只写一条语句。
    severity: S1
    category: 排版
    kind: 规则
    description_cn: 不允许把多个短语句写在一行中，即一行只写一条语句。 示例：如下例子不符合规范。  软件编程规范 1 排版 机密 rect.length = 0; rect.width = 0; 应如下书写 rect.length
      = 0; rect.width = 0;
    check_method: code_style
    auto_checkable: true
  SWC-C-1-7:
    title: if、for、do、while、case、switch、default等语句自占一行，且if、for、
    severity: S1
    category: 排版
    kind: 规则
    description_cn: if、for、do、while、case、switch、default等语句自占一行，且if、for、 do、while等语句的执行语句部分无论多少都要加括号{}。 示例：如下例子不符合规范。 if (NULL
      == pUserCR) return; 应如下书写： if (NULL == pUserCR) { return; } 加{}是为了以后增加新的语句时不容易出错，比如在return 前增加一语句，如果不加{}， 可能会导致每次都return。
      if (NULL == pUserCR) a=10; return;
    check_method: code_style
    auto_checkable: true
  SWC-C-1-8:
    title: 对齐只使用空格键，不使用TAB键。
    severity: S1
    category: 排版
    kind: 规则
    description_cn: 对齐只使用空格键，不使用TAB键。 说明：以免用不同的编辑器阅读程序时，因TAB 键所设置的空格数目不同而造成程序布局 不整齐。 补充：所有缩进要求都为1 tab = 4 spaces (进等于四个空格)
    check_method: code_style
    auto_checkable: true
  SWC-C-1-9:
    title: 函数或过程的开始、结构的定义及循环、判断等语句中的代码都要采用缩进风格，
    severity: S1
    category: 排版
    kind: 规则
    description_cn: '函数或过程的开始、结构的定义及循环、判断等语句中的代码都要采用缩进风格， case语句下的情况处理语句也要遵从语句缩进要求。 建议：对于case 语句，仍然采用大括号包裹。 示例： switch (n)
      { case 1:  软件编程规范 1 排版 机密 { … // Statements break; } case 2: { … // Statements break; } default: { // Statements break;
      } }'
    check_method: code_style
    auto_checkable: true
  SWC-C-1-10:
    title: 程序块的分界符（如C/C++语言的大括号‘{’和‘}’）应各独占一行并且位于
    severity: S1
    category: 排版
    kind: 规则
    description_cn: 程序块的分界符（如C/C++语言的大括号‘{’和‘}’）应各独占一行并且位于 同一列，同时与引用它们的语句左对齐。在函数体的开始、类的定义、结构的定义、枚举的定 义以及if、for、do、while、switch、case语句中的程序都要采用如上的缩进方式。
      示例：如下例子不符合规范。 for (...) { ... // program code } if (...) { ... // program code } void example_fun( void ) { ... // program
      code } 应如下书写。  软件编程规范 1 排版 机密 for (...) { ... // program code } if (...) { ... // prog
    check_method: code_style
    auto_checkable: true
  SWC-C-1-11:
    title: 在两个以上的关键字、变量、常量进行对等操作时，它们之间的操作符之前、之
    severity: S1
    category: 排版
    kind: 规则
    description_cn: 在两个以上的关键字、变量、常量进行对等操作时，它们之间的操作符之前、之 后或者前后要加空格；进行非对等操作时，如果是关系密切的立即操作符（如－>），后不应 加空格。 说明：采用这种松散方式编写代码的目的是使代码更加清晰。
      由于留空格所产生的清晰性是相对的，所以，在已经非常清晰的语句中没有必要再留空格， 如果语句已足够清晰则括号内侧(即左括号后面和右括号前面)不需要加空格，多重括号间 不必加空格，因为在C/C++语言中括号已经是最清晰的标志了。 在长语句中，如果需要加的空格非常多，那么应该保持整体清晰，而在局部不加空格。给
      操作符留空格时不要连续留两个以上空格。 示例： (1) 逗号、分号只在后面加空格。 int a, b, c; (2)比较操作符, 赋值操作符"=
    check_method: code_style
    auto_checkable: true
  SWC-C-1-12:
    title: 对于使用到的预编译宏，要在文件的适当地方加以说明。对于连续多行的宏在书
    severity: S1
    category: 排版
    kind: 规则
    description_cn: '对于使用到的预编译宏，要在文件的适当地方加以说明。对于连续多行的宏在书 写上要采用缩进的格式。 示例： #ifdef _BORLANDC_ #define FAR far #define NEAR near
      #ifdef OS_DEBUG #define TIMER_DEBUG TRUE #endif #else #define FAR #define NEAR #endif'
    check_method: code_style
    auto_checkable: true
  SWC-C-1-13:
    title: 对于夹在代码中的编译开关，在书写格式上应当和源代码一样进行缩排。
    severity: S1
    category: 排版
    kind: 规则
    description_cn: '对于夹在代码中的编译开关，在书写格式上应当和源代码一样进行缩排。 示例： if （TRUE == ucRecvFlag） { #if OS_DEBUG  软件编程规范 1 排版 机密 OS_PRINT（”Data
      received\n”）； #endif }  软件编程规范总则 2 注释 机密文档，不得扩散 13 2 注释'
    check_method: code_style
    auto_checkable: true
  SWC-C-2-1:
    title: 一般情况下，源程序有效注释量必须在20％以上。
    severity: S1
    category: 注释
    kind: 规则
    description_cn: 一般情况下，源程序有效注释量必须在20％以上。 说明：注释的原则是有助于对程序的阅读理解，在该加的地方都加了，注释不宜太多也不 能太少，注释语言必须准确、易懂、简洁。
    check_method: code_style
    auto_checkable: true
  SWC-C-2-2:
    title: 说明性文件（如头文件.h文件、.inc文件、.def文件、编译说明文件.cfg等）
    severity: S1
    category: 注释
    kind: 规则
    description_cn: '说明性文件（如头文件.h文件、.inc文件、.def文件、编译说明文件.cfg等） 头部应进行注释，注释必须列出：版权说明、版本号、生成日期、作者、内容、功能、与其它 文件的关系、修改日志等，头文件的注释中还应有函数功能简要说明。
      示例：下面这段头文件的头注释比较标准，当然，并不局限于此格式，但上述信息建议要 包含在内。 /************************************************* Copyright (C), 2005-2010,
      Naen Tech. Co., Ltd. File name: // test.h Author: Version: Date: // 作者、版本及完成日期 Description: // 用于详细说明此程'
    check_method: manual_review
    auto_checkable: false
  SWC-C-2-3:
    title: 源文件头部应进行注释，列出：版权说明、版本号、生成日期、作者、模块目的/
    severity: S1
    category: 注释
    kind: 规则
    description_cn: '源文件头部应进行注释，列出：版权说明、版本号、生成日期、作者、模块目的/ 功能、主要函数及其功能、修改日志等。 示例：下面这段源文件的头注释比较标准，当然，并不局限于此格式，但上述信息建议要 包含在内。  软件编程规范总则
      2 注释 机密文档，不得扩散 14 /************************************************************ Copyright (C), 2005-2010, Naen Tech.
      Co., Ltd. FileName: test.cpp Author: Version : Date: Description: // 模块描述 Version: // 版本信息 Function List: //'
    check_method: manual_review
    auto_checkable: false
  SWC-C-2-4:
    title: 函数头部应进行注释，列出：函数的目的/功能、输入参数、输出参数、返回值、
    severity: S1
    category: 注释
    kind: 规则
    description_cn: '函数头部应进行注释，列出：函数的目的/功能、输入参数、输出参数、返回值、 调用关系（函数、表）等。 示例：下面这段函数的注释比较标准，当然，并不局限于此格式，但上述信息建议要包含 在内。 /*************************************************
      Function: // 函数名称 Description: // 函数功能、性能等的描述 Calls: // 被本函数调用的函数清单（建议描述） Called By: // 调用本函数的函数清单（建议描述） Table Accessed:
      // 被访问的表（此项仅对于牵扯到数据库操作的程序） Table Updated: // 被修改的表（此项仅对于牵扯到数据库操作的程序） In'
    check_method: manual_review
    auto_checkable: false
  SWC-C-2-5:
    title: 边写代码边注释，修改代码同时修改相应的注释，以保证注释与代码的一致性。不
    severity: S1
    category: 注释
    kind: 规则
    description_cn: 边写代码边注释，修改代码同时修改相应的注释，以保证注释与代码的一致性。不 再有用的注释要删除。
    check_method: manual_review
    auto_checkable: false
  SWC-C-2-6:
    title: 注释的内容要清楚、明了，含义准确，防止注释二义性。
    severity: S1
    category: 注释
    kind: 规则
    description_cn: 注释的内容要清楚、明了，含义准确，防止注释二义性。 说明：错误的注释不但无益反而有害。
    check_method: manual_review
    auto_checkable: false
  SWC-C-2-7:
    title: 避免在注释中使用缩写，特别是非常用缩写。
    severity: S1
    category: 注释
    kind: 规则
    description_cn: 避免在注释中使用缩写，特别是非常用缩写。 说明：在使用缩写时或之前，应对缩写进行必要的说明。
    check_method: code_style
    auto_checkable: true
  SWC-C-2-8:
    title: 注释应与其描述的代码相近，对代码的注释应放在其上方或右方（对单条语句的注
    severity: S1
    category: 注释
    kind: 规则
    description_cn: 注释应与其描述的代码相近，对代码的注释应放在其上方或右方（对单条语句的注 释）相邻位置，不可放在下面，如放于上方则需与其上面的代码用空行隔开。 示例：如下例子不符合规范。 例1： /* get replicate
      sub system index and net indicator */ repssn_ind = ssn_data[index].repssn_index; repssn_ni = ssn_data[index].ni; 例2：
      repssn_ind = ssn_data[index].repssn_index; repssn_ni = ssn_data[index].ni; /* get replicate sub system index and
    check_method: code_style
    auto_checkable: true
  SWC-C-2-9:
    title: 对于所有有物理含义的变量、常量，如果其命名不是充分自注释的，在声明时都必
    severity: S1
    category: 注释
    kind: 规则
    description_cn: '对于所有有物理含义的变量、常量，如果其命名不是充分自注释的，在声明时都必 须加以注释，说明其物理含义。变量、常量、宏的注释应放在其上方相邻位置或右方。 示例： /* active statistic task
      number */ #define MAX_ACT_TASK_NUMBER 1000  软件编程规范总则 2 注释 机密文档，不得扩散 16 #define MAX_ACT_TASK_NUMBER 1000 /* active statistic
      task number */'
    check_method: manual_review
    auto_checkable: false
  SWC-C-2-10:
    title: 数据结构声明(包括数组、结构、类、枚举等)，如果其命名不是充分自注释的，
    severity: S1
    category: 注释
    kind: 规则
    description_cn: 数据结构声明(包括数组、结构、类、枚举等)，如果其命名不是充分自注释的， 必须加以注释。对数据结构的注释应放在其上方相邻位置，不可放在下面；对结构中的每个域 的注释放在此域的右方。 示例：可按如下形式说明枚举/数据/联合结构。
      /* sccp interface with sccp user primitive message name */ enum SCCP_USER_PRIMITIVE { N_UNITDATA_IND, /* sccp notify
      sccp user unit data come */ N_NOTICE_IND, /* sccp notify user the No.7 network can not */ /* transmission
    check_method: manual_review
    auto_checkable: false
  SWC-C-2-11:
    title: 全局变量要有较详细的注释，包括对其功能、取值范围、哪些函数或过程存取它
    severity: S1
    category: 注释
    kind: 规则
    description_cn: 全局变量要有较详细的注释，包括对其功能、取值范围、哪些函数或过程存取它 以及存取时注意事项等的说明。 示例： /* The ErrorCode when SCCP translate */ /* Global
      Title failure, as follows */ // 变量作用、含义 /* 0 －SUCCESS 1 －GT Table error */ /* 2 －GT error Others －no use */ // 变量取值范围
      /* only function SCCPTranslate() in */ /* this modual can modify it, and other */ /* module can visit it through
    check_method: manual_review
    auto_checkable: false
  SWC-C-2-12:
    title: 注释与所描述内容进行同样的缩排。
    severity: S1
    category: 注释
    kind: 规则
    description_cn: 注释与所描述内容进行同样的缩排。 说明：可使程序排版整齐，并方便注释的阅读与理解。 示例：如下例子，排版不整齐，阅读稍感不方便。 void example_fun( void ) { /* code one
      comments */ CodeBlock One  软件编程规范总则 2 注释 机密文档，不得扩散 17 /* code two comments */ CodeBlock Two } 应改为如下布局。 void example_fun(
      void ) { /* code one comments */ CodeBlock One /* code two comments */ CodeBlock Two }
    check_method: manual_review
    auto_checkable: false
  SWC-C-2-13:
    title: 将注释与其上面的代码用空行隔开。
    severity: S1
    category: 注释
    kind: 规则
    description_cn: 将注释与其上面的代码用空行隔开。 示例：如下例子，显得代码过于紧凑。 /* code one comments */ program code one /* code two comments */ program
      code two 应如下书写 /* code one comments */ program code one /* code two comments */ program code two
    check_method: code_style
    auto_checkable: true
  SWC-C-2-14:
    title: 对变量的定义和分支语句（条件分支、循环语句等）必须编写注释。
    severity: S1
    category: 注释
    kind: 规则
    description_cn: 对变量的定义和分支语句（条件分支、循环语句等）必须编写注释。 说明：这些语句往往是程序实现某一特定功能的关键，对于维护人员来说，良好的注释帮 助更好的理解程序，有时甚至优于看设计文档。对于变量的定义，如果不是充分自注释的，
      必须增加注释，写明用途，取值范围等。if, for, while, switch 必须加注释。
    check_method: manual_review
    auto_checkable: false
  SWC-C-2-15:
    title: 对于switch语句下的case语句，如果因为特殊情况需要处理完一个case后进入
    severity: S1
    category: 注释
    kind: 规则
    description_cn: '对于switch语句下的case语句，如果因为特殊情况需要处理完一个case后进入 下一个case处理，必须在该case语句处理完、下一个case语句前加上明确的注释。  软件编程规范总则 2 注释 机密文档，不得扩散
      18 说明：这样比较清楚程序编写者的意图，有效防止无故遗漏break 语句。 示例（注意斜体加粗部分）： case CMD_UP: ProcessUp(); break; case CMD_DOWN: ProcessDown();
      break; case CMD_FWD: ProcessFwd(); if (...) { ... break; } else { ProcessCFW_B(); // now jump into case CMD_A } case'
    check_method: manual_review
    auto_checkable: false
  SWC-C-2-16:
    title: 对使用到的硬件寄存器的各比特位或字段的含义，应给出明确的注释。
    severity: S1
    category: 注释
    kind: 规则
    description_cn: 对使用到的硬件寄存器的各比特位或字段的含义，应给出明确的注释。
    check_method: manual_review
    auto_checkable: false
  SWC-C-2-17:
    title: 在初始化硬件寄存器时，要对各寄存器初始值的确切含义给出明确的注释。
    severity: S1
    category: 注释
    kind: 规则
