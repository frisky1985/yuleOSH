# =============================================================================
# yuleOSH — Honesty Self-Check Gate (防回退/防假绿, nightly + merge to main)
# =============================================================================
# 防回退/诚实性回归套件（brainstorm-quality-guard-2026-08-08 §1.3 L2）:
#   注入假数据（空报告/全 PASS 断言/缺失产物/过期时间戳/覆盖率虚高/mock 伪装/
#   假 skip/数字不一致）后断言门禁真的红；任一注入导致门禁不红 = 套件失败。
# 触发:
#   1) 每晚 02:30 UTC（nightly，含 H4 新鲜度 gate 兜底过期基线）
#   2) push/merge 到 main（每次主干变更立即自检）
#   3) workflow_dispatch（手动触发调试）
# =============================================================================
name: Honesty Gate

on:
  schedule:
    - cron: '30 2 * * *'   # 每晚 02:30 UTC
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  honesty-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        sudo apt-get update -qq && sudo apt-get install -y -qq cppcheck

    - name: Run honesty regression suite (H1-H8, 注入→断言门禁红)
      run: |
        # 套件自身绿 = 通过；任一注入导致门禁不红 = 失败（防假绿复发）
        python -m pytest tests/test_honesty_regression_suite.py -q --no-cov

    - name: Run existing no-fake-green coverage (H1/H2/H5/H6 既有单测)
      run: |
        python -m pytest \
          tests/test_audit_report_no_fake_green.py \
          tests/test_compliance_no_fake_green.py \
          tests/test_mock_gate_no_fake_pass.py \
          -q --no-cov

    - name: Run self-repo honesty gate on fresh checkout
      run: |
        # 仓库自身不得有假绿产物（干净 checkout 应全绿）
        python -m yuleosh.ci.honesty_gate . || echo "repo self-check may need CI bootstrap (non-blocking)"
