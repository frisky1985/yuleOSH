# =============================================================================
# yuleOSH — Release Pipeline
# =============================================================================
# tag v* 触发 → 复用 desktop-packages.yml 三平台构建 → GitHub Release 上传。
# 产物: macOS .dmg / Linux .AppImage+.deb / Windows NSIS .exe
# 手动触发: workflow_dispatch（调试用，需手动填 tag 版本号）
# =============================================================================
name: yuleOSH Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v3.12.2)'
        required: true
        default: 'v3.12.2'

permissions:
  contents: write   # 创建 GitHub Release 需要

jobs:
  # ─── 三平台构建 (复用 desktop-packages.yml) ─────
  desktop-packages:
    uses: ./.github/workflows/desktop-packages.yml
    with:
      artifact-retention-days: 7
    secrets: inherit

  # ─── GitHub Release 发布 ────────────────────────
  release:
    needs: [desktop-packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # 需要完整 tag 历史生成 changelog

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ github.event.inputs.version }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG"

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
          # 只下载桌面安装包，排除 frontend-out（前端静态产物不属于 Release 资产）
          pattern: yuleOSH-*

      - name: List release artifacts
        run: |
          ls -la dist/

      - name: Generate release notes
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          PREV_TAG="$(git describe --tags --abbrev=0 "$TAG"^ 2>/dev/null || echo '')"
          {
            echo "## What's Changed"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              git log --oneline "$PREV_TAG".."$TAG" 2>/dev/null | sed 's/^/- /' || echo "- (changelog unavailable)"
            else
              echo "- Initial release"
            fi
            echo ""
            echo "## 产物"
            echo "- macOS: yuleOSH .dmg"
            echo "- Linux: AppImage + .deb"
            echo "- Windows: NSIS .exe"
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: yuleOSH ${{ steps.tag.outputs.tag }}
          body_path: release-notes.md
          files: dist/*
          draft: false
          prerelease: false
