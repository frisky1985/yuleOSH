# =============================================================================
# yuleOSH — Reusable workflow: Desktop 三平台构建 (macOS/Linux/Windows)
# =============================================================================
# 既是独立 workflow (push/PR 桌面变更触发), 也可被 release.yml 通过
# workflow_call 复用 (on: workflow_call)。
# 由 frontend-build 复合 action 构建前端 → 三平台 electron-builder 打包。
# =============================================================================
name: yuleOSH Desktop Packages

on:
  workflow_call:
    inputs:
      artifact-retention-days:
        description: 'Retention days for build artifacts'
        required: false
        type: number
        default: 7
  push:
    branches: [main, develop]
    paths:
      - 'desktop/**'
      - 'frontend/**'
      - '.github/workflows/desktop-packages.yml'
      - '.github/actions/frontend-build/**'
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'frontend/**'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build for (mac, linux, all)'
        required: true
        default: 'all'

jobs:
  # ─── 前端构建 (复用 composite action) ─────────────
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/frontend-build
        with:
          artifact-retention-days: ${{ inputs.artifact-retention-days || 7 }}

  # ─── macOS 构建 ─────────────────────────────────
  # PyInstaller 产物与 CPU 架构绑定，因此每个架构用对应 runner 构建，
  # 避免把 arm64 内置后端塞进 x64 dmg（运行即崩溃）。
  build-mac:
    needs: frontend-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13
            arch: x64
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}
    if: github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'mac' || github.event.inputs.platform == 'all') || github.event_name != 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Download frontend build
        uses: actions/download-artifact@v8
        with:
          name: frontend-out
          path: frontend/out/

      - name: Verify frontend build
        run: |
          ls -la frontend/out/index.html

      - name: Install desktop dependencies
        run: |
          cd desktop
          npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build embedded Python backend
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -e .
          cd desktop
          npm run build:backend
          node -e "const fs=require('fs');const p='build/backend/yuleosh-server';if(!fs.existsSync(p))process.exit(1);console.log('backend OK',fs.readdirSync(p).length,'entries')"

      - name: Build macOS .dmg
        run: |
          cd desktop
          npx electron-builder --mac --${{ matrix.arch }} --publish=never
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}

      - name: Stage macOS update metadata
        # 两个架构并行构建会各自产出同名 latest-mac.yml，先按架构改名，
        # 由 release.yml 合并成单一 latest-mac.yml 后上传 Release。
        run: |
          cd desktop/release
          test -f latest-mac.yml
          cp latest-mac.yml "latest-mac-${{ matrix.arch }}.yml"

      - name: Upload macOS build
        uses: actions/upload-artifact@v7
        with:
          name: yuleOSH-mac-dmg-${{ matrix.arch }}
          path: |
            desktop/release/*.dmg
            desktop/release/*-mac-*.zip
            desktop/release/latest-mac-*.yml
          retention-days: ${{ inputs.artifact-retention-days || 7 }}

  # ─── Linux 构建 ─────────────────────────────────
  build-linux:
    needs: frontend-build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'linux' || github.event.inputs.platform == 'all') || github.event_name != 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-xcb1 libxcb-dri3-0 libxdamage1 libxfixes3 \
            libxrandr2 libxss1 libxtst6 libnss3 libatk-bridge2.0-0 libgtk-3-0 \
            libgbm1 libasound2t64

      - name: Download frontend build
        uses: actions/download-artifact@v8
        with:
          name: frontend-out
          path: frontend/out/

      - name: Verify frontend build
        run: |
          ls -la frontend/out/index.html

      - name: Install desktop dependencies
        run: |
          cd desktop
          npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build embedded Python backend
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -e .
          cd desktop
          npm run build:backend
          node -e "const fs=require('fs');const p='build/backend/yuleosh-server';if(!fs.existsSync(p))process.exit(1);console.log('backend OK',fs.readdirSync(p).length,'entries')"

      # 内置后端为 x64 产物；arm64 AppImage 需在 arm64 runner 上单独构建。
      - name: Build Linux .AppImage + .deb
        run: |
          cd desktop
          npx electron-builder --linux --x64 --publish=never

      - name: Upload Linux build
        uses: actions/upload-artifact@v7
        with:
          name: yuleOSH-linux-appimage
          path: |
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/latest-linux.yml
          retention-days: ${{ inputs.artifact-retention-days || 7 }}

  # ─── Windows 构建 ───────────────────────────────
  build-win:
    needs: frontend-build
    runs-on: windows-latest
    if: github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'win' || github.event.inputs.platform == 'all') || github.event_name != 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Download frontend build
        uses: actions/download-artifact@v8
        with:
          name: frontend-out
          path: frontend/out/

      - name: Verify frontend build
        run: ls frontend/out/index.html

      - name: Install desktop dependencies
        run: cd desktop && npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build embedded Python backend
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -e .
          cd desktop
          npm run build:backend

      - name: Build Windows .exe
        run: cd desktop && npx electron-builder --win --publish=never

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: yuleOSH-win-installer
          path: |
            desktop/release/*.exe
            desktop/release/*.exe.blockmap
            desktop/release/latest.yml
          retention-days: ${{ inputs.artifact-retention-days || 7 }}
