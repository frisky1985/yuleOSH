# =============================================================================
# yuleOSH — Reusable workflow: Desktop 三平台构建 (macOS/Linux/Windows)
# =============================================================================
# 既是独立 workflow (push/PR 桌面变更触发), 也可被 release.yml 通过
# workflow_call 复用 (on: workflow_call)。
# 由 frontend-build 复合 action 构建前端 → 三平台 electron-builder 打包。
# =============================================================================
name: yuleOSH Desktop Packages

on:
  workflow_call:
    inputs:
      artifact-retention-days:
        description: 'Retention days for build artifacts'
        required: false
        type: number
        default: 7
  push:
    branches: [main, develop]
    paths:
      - 'desktop/**'
      - 'frontend/**'
      - '.github/workflows/desktop-packages.yml'
      - '.github/actions/frontend-build/**'
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'frontend/**'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build for (mac, linux, all)'
        required: true
        default: 'all'

jobs:
  # ─── 前端构建 (复用 composite action) ─────────────
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/frontend-build
        with:
          artifact-retention-days: ${{ inputs.artifact-retention-days || 7 }}

  # ─── macOS 构建 ─────────────────────────────────
  build-mac:
    needs: frontend-build
    runs-on: macos-latest
    if: github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'mac' || github.event.inputs.platform == 'all') || github.event_name != 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Download frontend build
        uses: actions/download-artifact@v8
        with:
          name: frontend-out
          path: frontend/out/

      - name: Verify frontend build
        run: |
          ls -la frontend/out/index.html

      - name: Install desktop dependencies
        run: |
          cd desktop
          npm ci

      - name: Build macOS .dmg
        run: |
          cd desktop
          npx electron-builder --mac --publish=never
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}

      - name: Upload macOS build
        uses: actions/upload-artifact@v7
        with:
          name: yuleOSH-mac-dmg
          path: desktop/release/*.dmg
          retention-days: ${{ inputs.artifact-retention-days || 7 }}

  # ─── Linux 构建 ─────────────────────────────────
  build-linux:
    needs: frontend-build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'linux' || github.event.inputs.platform == 'all') || github.event_name != 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-xcb1 libxcb-dri3-0 libxdamage1 libxfixes3 \
            libxrandr2 libxss1 libxtst6 libnss3 libatk-bridge2.0-0 libgtk-3-0 \
            libgbm1 libasound2

      - name: Download frontend build
        uses: actions/download-artifact@v8
        with:
          name: frontend-out
          path: frontend/out/

      - name: Verify frontend build
        run: |
          ls -la frontend/out/index.html

      - name: Install desktop dependencies
        run: |
          cd desktop
          npm ci

      - name: Build Linux .AppImage + .deb
        run: |
          cd desktop
          npx electron-builder --linux --publish=never

      - name: Upload Linux build
        uses: actions/upload-artifact@v7
        with:
          name: yuleOSH-linux-appimage
          path: |
            desktop/release/*.AppImage
            desktop/release/*.deb
          retention-days: ${{ inputs.artifact-retention-days || 7 }}

  # ─── Windows 构建 ───────────────────────────────
  build-win:
    needs: frontend-build
    runs-on: windows-latest
    if: github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'win' || github.event.inputs.platform == 'all')

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Download frontend build
        uses: actions/download-artifact@v8
        with:
          name: frontend-out
          path: frontend/out/

      - name: Verify frontend build
        run: ls frontend/out/index.html

      - name: Install desktop dependencies
        run: cd desktop && npm ci

      - name: Build Windows .exe
        run: cd desktop && npx electron-builder --win --publish=never

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: yuleOSH-win-installer
          path: desktop/release/*.exe
          retention-days: ${{ inputs.artifact-retention-days || 7 }}
