name: yuleOSH CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ─── 路径变更检测 (方案A: 按改动路径分流) ────────────────
  detect:
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.changes.outputs.src }}
      frontend: ${{ steps.changes.outputs.frontend }}
      desktop: ${{ steps.changes.outputs.desktop }}
      docs: ${{ steps.changes.outputs.docs }}
      workflow: ${{ steps.changes.outputs.workflow }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Detect changed paths
      uses: dorny/paths-filter@v3
      id: changes
      with:
        filters: |
          src:
            - 'src/**'
            - 'tests/**'
            - 'pyproject.toml'
            - 'pytest.ini'
          frontend:
            - 'frontend/**'
          desktop:
            - 'desktop/**'
          docs:
            - 'docs/**'
            - '*.md'
            - 'project-docs/**'
          workflow:
            - '.github/workflows/**'
            - '.github/actions/**'

  frontend-build:
    # v3.12.x CI 真跑修复 (2026-08-07): tests 依赖 frontend/out/ 静态产物
    # （test_server_integration / test_v390_t2_csp），但 out/ 被 .gitignore
    # 排除不入库 → CI checkout 无此目录 → 4 个测试 500 失败。
    # 复用 frontend-build 复合 action：独立 job 构建一次，
    # test matrix 下载 artifact，避免 4 个 Python 版本各自 npm build。
    needs: detect
    if: needs.detect.outputs.src == 'true' || needs.detect.outputs.frontend == 'true' || needs.detect.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/frontend-build

  test:
    needs: [detect, frontend-build]
    if: needs.detect.outputs.src == 'true' || needs.detect.outputs.frontend == 'true' || needs.detect.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45  # v3.10.0 Track1: 防失控测试挂满 6h（曾现 sendfile 自复制写盘死循环）
    strategy:
      fail-fast: false  # v3.10.0 Track1: 关 fail-fast，4 版本全跑完暴露真实失败面
      matrix:
        python-version: ['3.12']

    steps:
    - uses: ./.github/actions/setup-python-env
      with:
        python-version: ${{ matrix.python-version }}

    - name: Download frontend build
      # v3.12.x CI 真跑修复: 静态文件测试需要 frontend/out/（不入库）
      uses: actions/download-artifact@v8
      with:
        name: frontend-out
        path: frontend/out/

    - name: Run tests
      run: |
        # v3.10.0 Track1: pytest.ini addopts 仍带 --cov（9bf3e5ab 只删了 CLI 参数
        # 未真正生效）→ 用 --no-cov 显式关闭，test job 专注测试结果；
        # 覆盖率门禁由 code-quality/evidence 承担
        # 另: 输出 tee 落盘 + artifact 上传（if: always）——GitHub test job 日志
        # blob 系统性缺失（BlobNotFound），artifact 是唯一可靠的失败取证通道
        # 假绿修复 (2026-08-07): --no-cov 时覆盖率门禁由下方独立步骤执行；
        # benchmark 数据已入库（.gitignore 移除整体忽略）→ misra-benchmark 可真实运行。
        set -o pipefail
        python -m pytest tests/ -q --no-cov --ignore=tests/test_e2e.py --ignore=tests/test_e2e_pipeline.py --ignore=tests/test_alpha01_full_flow.py --ignore=tests/test_alpha02_onboarding.py --ignore=tests/test_onboarding_e2e.py --ignore=tests/ci/test_e2e_report_pipeline.py 2>&1 | tee pytest-${{ matrix.python-version }}.log

    - name: Coverage gate (fail-under 60)
      if: matrix.python-version == '3.12'
      run: |
        python -m pytest tests/ -q --no-header --cov=src/yuleosh --cov-fail-under=60 \
          --ignore=tests/test_e2e.py --ignore=tests/test_e2e_pipeline.py \
          --ignore=tests/test_alpha01_full_flow.py --ignore=tests/test_alpha02_onboarding.py \
          --ignore=tests/test_onboarding_e2e.py --ignore=tests/ci/test_e2e_report_pipeline.py 2>&1 | tail -20

    - name: Upload pytest log (always)
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: pytest-log-${{ matrix.python-version }}
        path: pytest-${{ matrix.python-version }}.log
        if-no-files-found: ignore

    - name: KG snapshot (P0-3)
      run: |
        python -m yuleosh.knowledge_graph.ci_hook \
          --build-id "ci-${{ github.run_id }}-${{ matrix.python-version }}" \
          --verbose || echo "KG snapshot failed (non-blocking, may need CI bootstrap)"
      env:
        OSH_HOME: ${{ github.workspace }}
      continue-on-error: true

    - name: Run CI Layer 1
      run: |
        python -m yuleosh.ci.run 1 || echo "CI L1 requires LLM API key, skipped"
      env:
        CI_RUN: "1"

  code-quality:
    needs: detect
    if: needs.detect.outputs.src == 'true' || needs.detect.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: ./.github/actions/setup-python-env

    - name: Install quality tooling
      run: |
        pip install ruff bandit mypy coverage
        # v3.10.0 Track1: workflow 语法门禁（防 ci.yml YAML 解析错误再犯）
        curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash
        pip install yamllint

    - name: Workflow Lint (actionlint + yamllint)
      run: |
        ./actionlint -color || echo "actionlint found issues (non-blocking)"
        yamllint .github/workflows/ -d relaxed || echo "yamllint found issues (non-blocking)"
      continue-on-error: true

    - name: Python Lint (ruff)
      run: |
        ruff check src/ --output-format=github || echo "ruff found issues (non-blocking)"
      continue-on-error: true

    - name: Security Scan (bandit)
      run: |
        bandit -r src/ -f sarif -o bandit-results.sarif || true
        bandit -r src/ -q || echo "bandit found issues (non-blocking)"
      continue-on-error: true

    - name: Type Check (mypy)
      run: |
        mypy src/ --ignore-missing-imports --warn-unused-configs --show-error-codes || echo "mypy found issues (non-blocking)"
      continue-on-error: true

    - name: Upload bandit SARIF
      uses: github/codeql-action/upload-sarif@v4
      # v3.10.0 Track1: bandit 步骤 continue-on-error，文件可能未生成；
      # 只有文件存在时才上传（否则 upload-sarif 报 Path does not exist）
      if: always() && hashFiles('bandit-results.sarif') != ''
      with:
        sarif_file: bandit-results.sarif
        category: bandit

  # ─── 方案B (渐进式): main 分支严格质量报告（不挡 merge，只出报告） ──
  quality-report:
    needs: detect
    if: needs.detect.outputs.src == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - uses: ./.github/actions/setup-python-env

    - name: Install strict tooling
      run: |
        pip install ruff bandit mypy

    - name: Strict ruff (no fallback, report only)
      run: |
        ruff check src/ --output-format=github > ruff-strict.txt || true
        echo "### ruff strict ($(wc -l < ruff-strict.txt) lines)" >> $GITHUB_STEP_SUMMARY
        head -50 ruff-strict.txt >> $GITHUB_STEP_SUMMARY || true

    - name: Strict mypy (report only)
      run: |
        mypy src/ --ignore-missing-imports --show-error-codes > mypy-strict.txt || true
        echo "### mypy strict ($(wc -l < mypy-strict.txt) lines)" >> $GITHUB_STEP_SUMMARY
        head -50 mypy-strict.txt >> $GITHUB_STEP_SUMMARY || true

    - name: Strict bandit (report only)
      run: |
        bandit -r src/ -q > bandit-strict.txt || true
        echo "### bandit strict ($(wc -l < bandit-strict.txt) lines)" >> $GITHUB_STEP_SUMMARY
        head -50 bandit-strict.txt >> $GITHUB_STEP_SUMMARY || true

    - name: Upload strict quality report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: quality-report-strict
        path: |
          ruff-strict.txt
          mypy-strict.txt
          bandit-strict.txt
        if-no-files-found: ignore

  cve-scan:
    needs: detect
    if: needs.detect.outputs.src == 'true' || needs.detect.outputs.frontend == 'true' || needs.detect.outputs.desktop == 'true' || needs.detect.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: ./.github/actions/setup-python-env
      with:
        extra-pip: 'pip-audit'

    - name: Python CVE scan (pip-audit)
      run: |
        bash scripts/cve-scan.sh --python

    - name: Setup Node.js for npm audit
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Desktop npm audit
      run: |
        cd desktop && npm install --silent 2>/dev/null || true
        npm audit --audit-level=high || echo "npm audit found issues (non-blocking for desktop)"
      continue-on-error: true

    - name: Frontend npm audit
      run: |
        cd frontend && npm install --silent 2>/dev/null || true
        npm audit --audit-level=high || echo "npm audit found issues (non-blocking for frontend)"
      continue-on-error: true

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Run plan-lint
      run: |
        python -c "
        import os
        issues = 0
        for root, dirs, files in os.walk('.'):
            for f in files:
                if 'task' in f.lower() and f.endswith('.md'):
                    content = open(os.path.join(root, f)).read()
                    if not any(k in content.lower() for k in ['feature','bugfix','refactor','docs']):
                        print('⚠️  Missing kind: ' + os.path.join(root, f))
                        issues += 1
        if issues:
            exit(1)
        print('✅ plan-lint passed')
        "

  evidence:
    needs: detect
    # 方案B: main 分支强制全量证据链（ASPICE）；develop/PR 跳过快照
    if: (needs.detect.outputs.src == 'true' || needs.detect.outputs.workflow == 'true') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - uses: ./.github/actions/setup-python-env

    - name: RTM Gate Check (ASPICE SWE.4)
      run: |
        bash docs/guides/ci-rtm-check.sh 80 project-docs/spec.md tests/

    - name: Generate evidence pack
      run: |
        python -m yuleosh.evidence.pack

    - name: Upload compliance pack
      uses: actions/upload-artifact@v7
      with:
        name: compliance-evidence
        path: .osh/evidence/
        if-no-files-found: error
