# =============================================================================
# yuleOSH — composite action: 前端静态构建 + 上传 artifact
# =============================================================================
# 抽出 ci.yml / desktop-build.yml / release.yml 三份重复的:
#   setup-node → npm ci → npm run build → verify → upload frontend-out
# 用法:
#   - uses: ./.github/actions/frontend-build
#     with:
#       artifact-retention-days: '7'   # 默认 7 天
# =============================================================================

name: 'Build frontend (static export)'
description: 'Install frontend deps, build static export, upload artifact'

inputs:
  artifact-retention-days:
    description: 'Retention days for the frontend-out artifact'
    required: false
    default: '7'

outputs:
  artifact-name:
    description: 'Name of the uploaded artifact'
    value: 'frontend-out'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      shell: bash
      run: |
        cd frontend
        npm ci

    - name: Build frontend (static export)
      shell: bash
      run: |
        cd frontend
        npm run build

    - name: Verify frontend build
      shell: bash
      run: |
        ls -la frontend/out/index.html

    - name: Upload frontend build artifact
      uses: actions/upload-artifact@v7
      with:
        name: frontend-out
        path: frontend/out/
        if-no-files-found: error
        retention-days: ${{ inputs.artifact-retention-days }}
