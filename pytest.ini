[pytest]
testpaths = tests
pythonpath = src
# CP-P2-02: All test files follow the test_*.py naming convention for consistency.
# 第三层隔离 (2026-08-19): -p randomly 随机化测试顺序，暴露单例/全局状态
# 跨测试污染（pytest 9 不自动发现 pytest-randomly 的 entry point，须显式加载；
# 实测 `--randomly` 报 unrecognized arguments，`-p randomly` 正常）。
# 失败复现: 日志含 "Using --randomly-seed=NNNNN"，重跑加 --randomly-seed=NNNNN。
# 与 conftest._isolate_global_registries 配套：即使乱序，单例注册表也逐测试恢复。
addopts = --cov=src/yuleosh --cov-report=term-missing --cov-report=html --cov-fail-under=5 -p randomly
# NOTE (coverage gate): --cov-fail-under=5 is the LOCAL DEV floor — intentionally
# low so that running a SUBSET of tests doesn't spuriously fail the coverage gate
# (a subset typically measures <10% of the whole package).  The real CI gate lives
# in pyproject.toml [tool.coverage.report] fail_under=30 and is enforced by CI
# workflows via explicit --cov-fail-under flags (see .github/workflows/ci.yml).
# NOTE (P1-1): addopts 的 --cov=... 依赖 pytest-cov，已声明于 pyproject.toml
# [project.optional-dependencies].dev —— 先 `pip install -e ".[dev]"` 再跑 pytest。
# 未安装 pytest-cov 时 pytest 报 "unrecognized arguments: --cov=..." 属预期错误
# （依赖缺失提示），并非配置缺陷。
markers =
    perf: Performance baseline tests (SWE.4-BP4)
    perf_spec: Spec parsing perf subgroup
    perf_evidence: Evidence collection perf subgroup
    perf_ci: CI config perf subgroup
    perf_api: API response time perf subgroup
    perf_mem: Memory baseline perf subgroup
    perf_integration: Integration perf subgroup
