misra:
  profiles:
    safety:
      rules:
        - mandatory
        - required
        - advisory
      block_on:
        - mandatory
        - required
      exclude_paths:
        - tests/**
        - third_party/**
      description: "Full MISRA compliance — all rules enforced, mandatory and required block"
    motor:
      rules:
        - mandatory
        - required
      block_on:
        - mandatory
      exclude_paths:
        - tests/**
        - third_party/**
        - examples/**
      description: "Motor control profile — mandatory blocks, required is advisory"
    benchmark:
      rules:
        - mandatory
      block_on:
        - mandatory
      exclude_paths:
        - tests/**
        - third_party/**
        - examples/**
        - demos/**
      description: "Benchmark profile — only mandatory rules block"
  active_profile: safety
  deviations:
    - rule: "Dir 4.1"
      file: "tests/unity/**"
      reason: "Unity test framework uses non-compliant patterns intentionally"
    - rule: "R 10.1"
      file: "src/hal/**"
      reason: "Hardware abstraction layer — value range verified by runtime checks"
  exclude_paths:
    - "tests/**"
    - "third_party/**"
    - "build/**"
  code_categories:
    template:
      paths:
        - "src/yuleosh/templates/**"
        - "test-dogfood/**"
      action: "exclude"
      block_on: false
    third_party:
      paths:
        - "third_party/**"
        - "Drivers/**"
        - "Middlewares/**"
        - "CMSIS/**"
        - "vendor/**"
        - "lib/**"
      action: "alert"
      block_on: false
    business:
      paths:
        - "src/**"
      action: "enforce"
      block_on: true

coverage:
  # 全局覆盖率阈值 —— 实际全局 Python 覆盖率约 5%
  # 对齐 pyproject.toml/pytest.ini fail_under=5
  threshold_line: 5.0
  threshold_condition: 5.0
  strict: false
  c_fail_under: 70
  module_thresholds: {}
