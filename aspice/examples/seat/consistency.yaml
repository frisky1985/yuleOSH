# consistency_check 规格：跨文档一致性（示例数据 · 不得作为项目证据）
# 两类检查：
#   entities —— 同一 ID 在设计文档与需求追踪表中的名称必须一致
#   facts    —— 同一数值事实（阈值/指标）在所有文档中的取值必须一致

scan:                                  # fact 扫描范围（相对 seat/ 目录）
  - SYS.2_系统需求规格说明书_座椅控制器示例_V1.0.xlsx
  - SYS.3_系统架构设计说明书_座椅控制器示例_V1.0.xlsx
  - SWE.1_软件需求规格说明书_座椅控制器示例_V1.0.xlsx
  - SWE.2_软件架构设计说明书_座椅控制器示例_V1.0.xlsx
  - HWE.1_硬件需求规格说明书_座椅控制器示例_V1.0.xlsx
  - HWE.2_硬件设计说明书_座椅控制器示例_V1.0.xlsx
  - ENG_需求追踪表_座椅控制器示例_V1.0.xlsx
  - ENG_测试规范_座椅控制器示例_V1.0.xlsx

entities:
  canonical:                           # 名称真源：ENG_需求追踪表
    file: ENG_需求追踪表_座椅控制器示例_V1.0.xlsx
    sheets:
      软件架构元素清单: { id: 软件架构元素标识, name: 标题 }
      硬件设计元素清单: { id: 硬件设计元素标识, name: 标题 }
      系统架构元素清单: { id: 系统架构元素标识, name: 标题 }
  sources:                             # 设计文档侧（与真源比对）
    - file: SWE.2_软件架构设计说明书_座椅控制器示例_V1.0.xlsx
      sheet: 3.软件静态架构设计
      id: 模块ID
      name: 模块名
      id_pattern: '^SW-ARCH-SEAT-\d+$'
      canonical_sheet: 软件架构元素清单
    - file: HWE.2_硬件设计说明书_座椅控制器示例_V1.0.xlsx
      sheet: 2.硬件架构设计
      id: ID
      name: 名称
      id_pattern: '^HW-DES-SEAT-\d+$'    # 过滤同 sheet 内接口表/状态机等非实体行
      canonical_sheet: 硬件设计元素清单
    - file: SYS.3_系统架构设计说明书_座椅控制器示例_V1.0.xlsx
      sheet: 3.系统静态架构设计
      id: No.
      name: 物理结构要素
      id_pattern: '^SYS-ARCH-SEAT-\d+$'
      canonical_sheet: 系统架构元素清单

facts:                                 # 数值事实：正则捕获组(1)为数值，全部出现必须等于 expect
  - { name: 欠压保护阈值,   pattern: '欠压[^\d]{0,6}(\d+(?:\.\d+)?)\s*V',   expect: '8.5',  unit: V }
  - name: 休眠电流上限
    pattern: '休眠电流\s*≤\s*(\d+(?:\.\d+)?)\s*mA'   # 只匹配限值表述；设计达成值 0.6mA 是另一类陈述
    expect: '1'
    unit: mA
  - { name: PWM 频率,       pattern: '(\d+(?:\.\d+)?)\s*kHz',               expect: '10',   unit: kHz }
  - { name: LIN 总线速率,   pattern: '(\d+(?:\.\d+)?)\s*kbps',              expect: '19.2', unit: kbps }
  - { name: 记忆位置组数,   pattern: '(\d+)\s*组记忆',                      expect: '3',    unit: 组 }
  - name: 单路持续电流                         # 每通道指标（HWE.1/SYS.3）
    patterns: ['单路[^\d]{0,6}(\d+(?:\.\d+)?)\s*A\s*持续', '单路持续\s*(\d+(?:\.\d+)?)\s*A']
    expect: '2'
    unit: A
  - name: 单路峰值电流
    patterns: ['峰值\s*(\d+(?:\.\d+)?)\s*A(?!\s*/)', '(\d+(?:\.\d+)?)\s*A\s*峰值']
    expect: '5'
    unit: A
  - name: 整机连续电流                         # 整板合计指标（HWE.2，与单路指标是不同事实）
    pattern: '连续\s*(\d+(?:\.\d+)?)\s*A'
    expect: '8'
    unit: A
  - name: 整机峰值电流
    pattern: '峰值\s*(\d+(?:\.\d+)?)\s*A\s*/'
    expect: '12'
    unit: A
  # --- 资源使用事实（4.0.1 扩展清单：资源使用证据）---
  # 注：7.软件控制策略 的模块 CPU 均值（8+6+6+5+3+4=32%）与峰值 62% 是不同口径，
  #     求和校验不适用，故只对同口径标称值做一致性核验。
  - { name: CPU 峰值占用,   pattern: 'CPU\s*(\d+(?:\.\d+)?)\s*%',       expect: '62',  unit: '%' }
  - { name: CPU 目标上限,   pattern: '目标\s*≤\s*(\d+(?:\.\d+)?)\s*%',  expect: '70',  unit: '%' }
  - { name: Flash 预算,     pattern: 'Flash\s*(\d+(?:\.\d+)?)\s*KB',    expect: '62',  unit: KB }
  - { name: RAM 预算,       pattern: 'RAM\s*(\d+(?:\.\d+)?)\s*KB',      expect: '7',   unit: KB }
  - { name: MCU 主频,       pattern: 'Cortex[-\w+]{0,8}[，,]?\s*(\d+(?:\.\d+)?)\s*MHz', expect: '48', unit: MHz }
  - { name: 晶振频率,       pattern: '(\d+(?:\.\d+)?)\s*MHz\s*晶振',    expect: '8',   unit: MHz }
  - { name: Flash 总量,     pattern: '(\d+(?:\.\d+)?)\s*KB\s*Flash',    expect: '128', unit: KB }
  - { name: RAM 总量,       pattern: '(\d+(?:\.\d+)?)\s*KB\s*RAM',      expect: '16',  unit: KB }
