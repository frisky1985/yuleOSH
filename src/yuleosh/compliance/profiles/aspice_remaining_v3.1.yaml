# ASPICE v3.1 — remaining process areas
# ACQ.1/2/3 · SPL.1 · SUP.2~7 · PIM.1/2 · REU.1
# Evidence paths align with step_handlers/remaining_processes.py;
# config source of truth: compliance/remaining_specs.py.

meta:
  standard: ASPICE
  version: '3.1'
  description: Remaining process areas — ACQ.1/2/3, SPL.1, SUP.2~7, PIM.1/2, REU.1
acq.1:
  id: ACQ.1
  title: Acquisition Preparation
  description: 'Plan the acquisition: scope, make-or-buy decisions, acceptance criteria
    and the inputs required before selecting a supplier.'
  order: 46
  base_practices:
  - id: ACQ.1.BP1
    title: Define acquisition strategy and criteria
    output_evidence:
    - type: document
      path: docs/acquisition-plan.md
      description: 'ACQ.1 work product: docs/acquisition-plan.md'
    check:
    - An acquisition plan defines scope, strategy and acceptance criteria
  - id: ACQ.1.BP2
    title: Collect acquisition inputs
    output_evidence:
    - type: document
      path: docs/acquisition-requirements.yaml
      description: 'ACQ.1 work product: docs/acquisition-requirements.yaml'
    check:
    - Acquisition records are collected from identified sources
  - id: ACQ.1.BP3
    title: Ensure acquisition traceability
    output_evidence:
    - type: document
      path: docs/acquisition-plan.md
      description: 'ACQ.1 work product: docs/acquisition-plan.md'
    - type: document
      path: docs/acquisition-requirements.yaml
      description: 'ACQ.1 work product: docs/acquisition-requirements.yaml'
    check:
    - Acquisition entries are traceable in the plan
  - id: ACQ.1.BP4
    title: Control acquisition decisions
    output_evidence:
    - type: document
      path: docs/acquisition-requirements.yaml
      description: 'ACQ.1 work product: docs/acquisition-requirements.yaml'
    check:
    - Accepted acquisition items carry a decision rationale
