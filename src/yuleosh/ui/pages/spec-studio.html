<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <title>yuleOSH · Spec Studio (单轮生成 + 草稿编辑)</title>
  <style>
    :root {
      --bg: #0f1115; --surface: #181a20; --panel: #1e2028; --border: #2a2d36;
      --text: #e8eaed; --text2: #9aa0a6; --blue: #3b82f6; --green: #22c55e;
      --red: #ef4444; --orange: #f59e0b; --purple: #8b5cf6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    }
    header {
      height: 56px; flex-shrink: 0; display: flex; align-items: center;
      justify-content: space-between; padding: 0 20px;
      background: var(--surface); border-bottom: 1px solid var(--border);
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; }
    .logo { width: 26px; height: 26px; border-radius: 6px; background: linear-gradient(135deg, var(--blue), var(--purple)); }
    .tag {
      font-size: 11px; padding: 2px 8px; border-radius: 20px;
      border: 1px solid rgba(245,158,11,.4); color: var(--orange); background: rgba(245,158,11,.08);
    }
    .tag.mock { border-color: rgba(245,158,11,.4); color: var(--orange); background: rgba(245,158,11,.08); }
    .tag.live { border-color: rgba(34,197,94,.4); color: var(--green); background: rgba(34,197,94,.08); }
    .hint { font-size: 12px; color: var(--text2); }

    main { flex: 1; display: grid; grid-template-columns: 360px 1fr; overflow: hidden; }

    .left {
      background: var(--surface); border-right: 1px solid var(--border);
      padding: 18px; overflow-y: auto;
    }
    .field { margin-bottom: 16px; }
    label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--text2); margin-bottom: 7px; }
    textarea, input, select {
      width: 100%; background: var(--panel); border: 1px solid var(--border);
      color: var(--text); border-radius: 8px; padding: 10px 12px;
      font-size: 13px; font-family: inherit; resize: vertical; outline: none;
    }
    textarea:focus, input:focus, select:focus { border-color: var(--blue); }
    #prompt { min-height: 150px; line-height: 1.6; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn {
      width: 100%; padding: 11px 14px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--panel); color: var(--text); font-size: 13px; font-weight: 500;
      cursor: pointer; transition: .15s;
    }
    .btn:hover:not(:disabled) { border-color: var(--blue); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-primary { background: var(--blue); border-color: var(--blue); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #2563eb; }
    .btn-green { background: rgba(34,197,94,.12); border-color: rgba(34,197,94,.45); color: var(--green); }
    .btn-green:hover:not(:disabled) { background: rgba(34,197,94,.2); }
    .btn-sm { width: auto; padding: 7px 12px; font-size: 12px; }
    .meta-line { font-size: 11px; color: var(--text2); margin-top: 6px; font-family: ui-monospace, Consolas, monospace; word-break: break-all; }

    .right { display: flex; flex-direction: column; overflow: hidden; }
    .editor-head {
      padding: 12px 18px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      background: var(--panel);
    }
    .file-name { font-size: 12px; font-family: ui-monospace, Consolas, monospace; color: var(--text2); }
    .file-name.draft { color: var(--orange); }
    .file-name.spec { color: var(--green); }
    .actions { display: flex; gap: 8px; }

    .editor-wrap { flex: 1; overflow: hidden; display: flex; }
    #editor {
      flex: 1; width: 100%; height: 100%; border: none; border-radius: 0;
      background: var(--bg); padding: 18px 20px; resize: none;
      font-family: ui-monospace, "SFMono-Regular", Consolas, Menlo, monospace;
      font-size: 13px; line-height: 1.75; color: var(--text); outline: none;
    }
    #editor::placeholder { color: #4b5563; }

    .checks {
      flex-shrink: 0; border-top: 1px solid var(--border); background: var(--panel);
      padding: 12px 18px; max-height: 190px; overflow-y: auto;
    }
    .checks-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 10px; }
    .chk {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 7px; padding: 9px 11px;
    }
    .chk-val { font-size: 18px; font-weight: 700; line-height: 1.3; }
    .chk-label { font-size: 10px; color: var(--text2); margin-top: 2px; }
    .issue {
      font-size: 12px; padding: 5px 0; border-bottom: 1px solid var(--border);
      display: flex; gap: 8px; align-items: baseline;
    }
    .issue:last-child { border-bottom: none; }
    .sev { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 4px; flex-shrink: 0; }
    .sev.ERROR { background: rgba(239,68,68,.15); color: var(--red); }
    .sev.WARNING { background: rgba(245,158,11,.15); color: var(--orange); }
    .sev.INFO { background: rgba(59,130,246,.15); color: var(--blue); }
    .empty-issue { font-size: 12px; color: var(--text2); padding: 4px 0; }

    .toast {
      position: fixed; top: 66px; left: 50%; z-index: 50;
      padding: 10px 16px; border-radius: 8px; font-size: 13px;
      background: var(--panel); border: 1px solid var(--border);
      box-shadow: 0 8px 30px rgba(0,0,0,.4);
      opacity: 0; transform: translate(-50%, -10px);
      transition: .2s; pointer-events: none; max-width: min(420px, 90vw);
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .toast.err { border-color: rgba(239,68,68,.5); color: #fca5a5; }
    .toast.ok { border-color: rgba(34,197,94,.5); color: #86efac; }

    .spinner {
      display: inline-block; width: 12px; height: 12px; border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite;
      vertical-align: -2px; margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 820px) {
      body { height: auto; overflow: auto; }
      main { display: block; overflow: visible; }
      .left { border-right: none; border-bottom: 1px solid var(--border); }
      .right { min-height: 0; }
      .editor-wrap { min-height: 340px; max-height: 60vh; }
      #editor { height: 340px; }
      .checks { max-height: none; }
      .checks-grid { grid-template-columns: repeat(2, 1fr); }
      header { padding: 0 12px; gap: 8px; }
      .brand { font-size: 14px; flex-shrink: 0; }
      .brand .sub { display: none; }
      .hint { font-size: 11px; text-align: right; }
      .tag { flex-shrink: 0; white-space: nowrap; }
    }
    @media (max-width: 560px) {
      .hint { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo"></div>
      <span>yuleOSH</span>
      <span class="sub">· Spec Studio</span>
      <span class="tag" id="modeTag">DEMO</span>
    </div>
    <div class="hint">单轮生成 → 草稿编辑 → 保存正式 spec</div>
  </header>

  <main>
    <section class="left">
      <div class="field">
        <label for="prompt">需求 / 提示词输入</label>
        <textarea id="prompt" placeholder="例如：&#10;做一个上电自检功能，要求 100ms 内完成，自检项包括 RAM、Flash、看门狗；自检失败时进入安全状态并记录故障码。"></textarea>
      </div>

      <div class="field">
        <label for="mode">生成模式</label>
        <select id="mode">
          <option value="extract">extract — 从描述中提炼需求</option>
          <option value="decompose">decompose — 把已有 spec 拆成可执行需求</option>
        </select>
      </div>

      <div class="field">
        <label for="projectDir">项目目录（相对 OSH_HOME）</label>
        <input id="projectDir" value="projects/spec-studio-demo" />
        <div class="meta-line" id="dirHint">首次生成会自动创建目录</div>
      </div>

      <div class="field">
        <button class="btn btn-primary" id="genBtn">生成草稿</button>
      </div>

      <div class="field">
        <label>当前产物</label>
        <div class="meta-line" id="artifactInfo">尚未生成</div>
      </div>
    </section>

    <section class="right">
      <div class="editor-head">
        <div class="file-name" id="fileName">spec.draft.md</div>
        <div class="actions">
          <button class="btn btn-sm" id="revalidateBtn" disabled>存为草稿</button>
          <button class="btn btn-sm btn-green" id="promoteBtn" disabled>保存为正式 spec</button>
        </div>
      </div>

      <div class="editor-wrap">
        <textarea id="editor" spellcheck="false" placeholder="# 生成的 OpenSpec 草稿会出现在这里，可直接编辑…"></textarea>
      </div>

      <div class="checks">
        <div class="checks-grid">
          <div class="chk"><div class="chk-val" id="ckReq">—</div><div class="chk-label">需求</div></div>
          <div class="chk"><div class="chk-val" id="ckScn">—</div><div class="chk-label">场景</div></div>
          <div class="chk"><div class="chk-val" id="ckErr" style="color:var(--red)">—</div><div class="chk-label">错误</div></div>
          <div class="chk"><div class="chk-val" id="ckIss" style="color:var(--orange)">—</div><div class="chk-label">提示</div></div>
        </div>
        <div id="issues"><div class="empty-issue">生成或保存后显示校验结果</div></div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    const $ = (id) => document.getElementById(id);
    let generated = null;   // 最近一次生成结果

    function toast(msg, kind) {
      const el = $('toast');
      el.textContent = msg;
      el.className = 'toast show ' + (kind || '');
      clearTimeout(el._t);
      el._t = setTimeout(() => { el.className = 'toast'; }, 3200);
    }

    async function apiPost(path, body) {
      const res = await fetch(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify(body),
      });
      let json = null;
      try { json = await res.json(); } catch (e) { /* 非 JSON 响应 */ }
      if (res.status === 401) throw new Error('未登录（401），请先登录或开启 AUTH_DISABLED 演示模式');
      if (!res.ok) {
        const msg = (json && (json.error || (json.data && json.data.error))) || ('HTTP ' + res.status);
        throw new Error(msg);
      }
      if (!json) throw new Error('响应不是合法 JSON');
      if (json.ok === false) throw new Error(json.error || '接口返回失败');
      return json.data || json;
    }

    function setBusy(btn, busy, label) {
      if (busy) {
        btn.disabled = true;
        btn.dataset.label = btn.textContent;
        btn.innerHTML = '<span class="spinner"></span>' + (label || '处理中…');
      } else {
        btn.disabled = false;
        btn.textContent = btn.dataset.label || label;
      }
    }

    function renderChecks(v) {
      const issues = (v && v.issues) || [];
      const errs = (v && (v.errors || [])).length
        ? v.errors
        : issues.filter(i => String(i.severity || '').toUpperCase() === 'ERROR');
      const others = issues.filter(i => String(i.severity || '').toUpperCase() !== 'ERROR');

      $('ckReq').textContent = (v && v.requirements != null) ? v.requirements
                              : ((v && v.requirement_count != null) ? v.requirement_count : '—');
      $('ckScn').textContent = (v && v.scenarios != null) ? v.scenarios : '—';
      $('ckErr').textContent = errs.length;
      $('ckIss').textContent = others.length;

      const box = $('issues');
      const all = [...errs, ...others];
      if (!all.length) {
        box.innerHTML = '<div class="empty-issue">无问题 — 内容可解析且通过校验</div>';
        return;
      }
      box.innerHTML = all.slice(0, 20).map(i => {
        const sev = String(i.severity || 'INFO').toUpperCase();
        const msg = typeof i === 'string' ? i : (i.message || JSON.stringify(i));
        return `<div class="issue"><span class="sev ${sev}">${sev}</span><span>${escapeHtml(msg)}</span></div>`;
      }).join('');
    }

    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = String(s == null ? '' : s);
      return d.innerHTML;
    }

    async function doGenerate() {
      const prompt = $('prompt').value.trim();
      if (!prompt) { toast('请先输入需求或提示词', 'err'); return; }

      const btn = $('genBtn');
      setBusy(btn, true, '生成中…');
      try {
        const data = await apiPost('/api/v1/spec/generate', {
          input_text: prompt,
          project_dir: $('projectDir').value.trim(),
          mode: $('mode').value,
          auto: false,
          create_if_missing: true,
        });
        generated = data;
        $('editor').value = data.content || '';
        $('fileName').textContent = basename(data.output_path);
        $('fileName').className = 'file-name ' + (data.written === 'spec' ? 'spec' : 'draft');
        $('artifactInfo').textContent = data.output_path + '  (written=' + data.written + ')';
        $('modeTag').textContent = data.used_mock ? 'DEMO · MOCK LLM' : 'LIVE · REAL LLM';
        $('modeTag').className = 'tag ' + (data.used_mock ? 'mock' : 'live');
        $('revalidateBtn').disabled = false;
        $('promoteBtn').disabled = false;
        renderChecks(Object.assign({}, data.validation || {}, {
          requirements: data.requirements,
          scenarios: data.scenarios,
        }));
        toast('草稿已生成，可直接编辑', 'ok');
      } catch (e) {
        toast('生成失败：' + e.message, 'err');
      } finally {
        setBusy(btn, false);
      }
    }

    async function doSave(target) {
      const content = $('editor').value;
      if (!content.trim()) { toast('编辑器为空，无法保存', 'err'); return; }

      const btn = target === 'spec' ? $('promoteBtn') : $('revalidateBtn');
      setBusy(btn, true, '保存中…');
      try {
        const data = await apiPost('/api/v1/spec/save', {
          project_dir: $('projectDir').value.trim(),
          content,
          target,
        });
        $('fileName').textContent = basename(data.path);
        $('fileName').className = 'file-name ' + (target === 'spec' ? 'spec' : 'draft');
        $('artifactInfo').textContent = data.path + '  (target=' + target + ')';
        renderChecks(data);
        if (data.error_count > 0) {
          toast('已保存，但存在 ' + data.error_count + ' 个错误', 'err');
        } else {
          toast(target === 'spec' ? '已保存为正式 spec' : '草稿已保存', 'ok');
        }
      } catch (e) {
        toast('保存失败：' + e.message, 'err');
      } finally {
        setBusy(btn, false);
      }
    }

    function basename(p) {
      if (!p) return 'spec.draft.md';
      const parts = String(p).split('/');
      return parts[parts.length - 1];
    }

    // 事件绑定统一走 addEventListener：页面 CSP 为 script-src 'nonce-...'，
    // 内联 onclick 会被浏览器拦截。
    $('genBtn').addEventListener('click', doGenerate);
    $('revalidateBtn').addEventListener('click', () => doSave('draft'));
    $('promoteBtn').addEventListener('click', () => doSave('spec'));
    $('mode').addEventListener('change', () => {
      $('dirHint').textContent = '首次生成会自动创建目录';
    });
  </script>
</body>
</html>
