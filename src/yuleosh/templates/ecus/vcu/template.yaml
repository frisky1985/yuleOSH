name: vcu
version: 1.0.0
description: Vehicle Control Unit — 动力域控制器/扭矩管理
mcu: S32K324
asil: ASIL_D
platforms: [arm, s32k324, nxp]
tags: [autosar, bsw, vehicle-control, powertrain, automotive, safety]
spec_sections:
  - System Overview
  - Torque Management
  - Motor Control
  - Pedal Monitoring
  - Gear Management
  - Thermal Management
  - Safety (ASIL D)
  - Test Plan
bsw_modules:
  - Mcu
  - Dio
  - Port
  - Gpt
  - Can
  - Spi
  - Icu
  - Pwm
  - Adc
  - Fls
  - Eep
  - Wdg
  - RamTst
  - Crypto
swcs:
  - TorqueManager_SWC
  - MotorControl_SWC
  - PedalMonitor_SWC
  - GearManager_SWC
  - ThermalMgr_SWC
pipeline_config:
  default_steps: [spec-parse, requirements-analysis, sdd, code-gen, internal-review, test-plan, code-review, unit-test, cross-compile, static-analysis, system-verification]
  ci_layers: [L1, L2, L3]
