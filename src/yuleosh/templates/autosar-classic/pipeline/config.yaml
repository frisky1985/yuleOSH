# yuleOSH Pipeline Configuration — AUTOSAR Classic
steps:
  - id: spec-parse
    name: Spec Parsing
    handler: spec_parse
  - id: requirements-analysis
    name: Requirements Analysis
    handler: super_analysis
  - id: sdd
    name: System Design Document
    handler: hermes_prd
  - id: code-gen
    name: Code Generation
    handler: claude_dev
  - id: internal-review
    name: Internal Review
    handler: internal_review
  - id: test-plan
    name: Test Plan Generation
    handler: test_planning
  - id: code-review
    name: Code Review
    handler: hermes_review
  - id: unit-test
    name: CI Layer 1
    handler: ci_layer1
  - id: cross-compile
    name: CI Layer 2 — Cross Compile
    handler: ci_layer2
  - id: qemu-run
    name: QEMU 仿真测试 (L2)
    handler: qemu_run
  - id: c-coverage-gate
    name: C 覆盖率门禁 (L2)
    handler: coverage_gate
  - id: static-analysis
    name: AUTOSAR Compliance Static Analysis
    handler: static_analysis
  - id: system-verification
    name: CI Layer 3
    handler: ci_layer3
ci_layers:
  L1: {unit_test: true, linter: true}
  L2: {cross_compile: true, qemu_run: true, c_coverage_gate: true, autosar_check: true, static_analysis: true}
  L3: {hardware_test: true, evidence_pack: true}
review_gates:
  - {type: internal, before: code-gen}
  - {type: autosar, before: static-analysis}
  - {type: compliance, after: system-verification}

# yuleOSH 大模型代码生成的项目级硬规则。code-gen 每次运行都会把本段
# 注入系统提示词，并在每轮输出后校验目录与 include 依赖，违规自动反馈重生成。
codegen:
  target_language: c
  language: c
  max_tokens: 16000
  max_retries: 3
  autosar_classic:
    enabled: true
    source_root: src
    required_dirs:
      - src/application
      - src/rte
      - src/bsw/services
      - src/bsw/ecu_abstraction
      - src/bsw/mcal
    common_dirs:
      - src/common
    entry_files:
      - src/main.c
