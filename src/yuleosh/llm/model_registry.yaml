# Model Registry — 默认模型配置（P2.1）
#
# 此文件定义 yuleOSH 的模型路由表，从 client.py 硬编码迁移而来。
# 支持三层覆盖：内置 < 环境变量 < 项目级（.yuleosh/model-registry.yaml）

# ═══════════════════════════════════════════════════════════════════════
# 模型定义
# ═══════════════════════════════════════════════════════════════════════

models:
  # ── 云端模型 ──────────────────────────────────────────────────────
  claude-4-sonnet:
    provider: anthropic
    context_window: 200000
    risk_level: L4
    capabilities: [code_generation, architecture_design, review]
    pricing:
      input_per_1k: 0.015
      output_per_1k: 0.075
    is_local: false

  claude-4-haiku:
    provider: anthropic
    context_window: 200000
    risk_level: L2
    capabilities: [summary, simple_review]
    pricing:
      input_per_1k: 0.003
      output_per_1k: 0.015
    is_local: false

  deepseek-v4:
    provider: deepseek
    context_window: 128000
    risk_level: L4
    capabilities: [code_generation, test_generation, review]
    pricing:
      input_per_1k: 0.002
      output_per_1k: 0.008
    is_local: false

  deepseek-chat:
    provider: deepseek
    context_window: 128000
    risk_level: L3
    capabilities: [code_generation, review]
    pricing:
      input_per_1k: 0.002
      output_per_1k: 0.008
    is_local: false

  gpt-4o:
    provider: openai
    context_window: 128000
    risk_level: L4
    capabilities: [code_generation, architecture_design, review]
    pricing:
      input_per_1k: 0.010
      output_per_1k: 0.030
    is_local: false

  # ── 本地模型（Ollama）──────────────────────────────────────────────
  deepseek-r1:7b:
    provider: ollama
    context_window: 32768
    risk_level: L2
    capabilities: [code_generation, review]
    pricing:
      input_per_1k: 0.0
      output_per_1k: 0.0
    is_local: true

  qwen2.5-coder:14b:
    provider: ollama
    context_window: 32768
    risk_level: L3
    capabilities: [code_generation, test_generation]
    pricing:
      input_per_1k: 0.0
      output_per_1k: 0.0
    is_local: true

  qwen2.5-coder:7b:
    provider: ollama
    context_window: 32768
    risk_level: L2
    capabilities: [code_generation, simple_review]
    pricing:
      input_per_1k: 0.0
      output_per_1k: 0.0
    is_local: true

  # ── Mock 模型（测试用）────────────────────────────────────────────
  mock:
    provider: mock
    context_window: 32768
    risk_level: L0
    capabilities: [test]
    pricing:
      input_per_1k: 0.0
      output_per_1k: 0.0
    is_local: true

# ═══════════════════════════════════════════════════════════════════════
# 任务路由（task_type → model）
# ═══════════════════════════════════════════════════════════════════════

task_routes:
  architecture_design: claude-4-sonnet
  code_generation: deepseek-v4
  safety_code_generation: claude-4-sonnet
  test_generation: deepseek-v4
  misra_review: claude-4-sonnet
  misra_fix: claude-4-sonnet
  review_blocking: claude-4-sonnet
  review_selfcheck: deepseek-v4
  simple_summary: deepseek-v4

# ═══════════════════════════════════════════════════════════════════════
# Agent 路由（agent_name → {model, provider, task_type, risk_level}）
# ═══════════════════════════════════════════════════════════════════════

agent_routes:
  小明:
    model: deepseek-v4
    provider: deepseek
    task_type: review_blocking
    risk_level: L4

  小克:
    model: deepseek-v4
    provider: deepseek
    task_type: code_generation
    risk_level: L4

  小马:
    model: deepseek-v4
    provider: deepseek
    task_type: misra_review
    risk_level: L3

  Hermes:
    model: claude-4-sonnet
    provider: anthropic
    task_type: architecture_design
    risk_level: L4

  Claude:
    model: claude-4-sonnet
    provider: anthropic
    task_type: architecture_design
    risk_level: L4

  Codex:
    model: deepseek-v4
    provider: deepseek
    task_type: review_blocking
    risk_level: L4

  小仓:
    model: deepseek-v4
    provider: deepseek
    task_type: review_blocking
    risk_level: L4

  QEMU:
    model: deepseek-v4
    provider: deepseek
    task_type: simple_summary
    risk_level: L1

# 2026-11-02: 原 task_risk_levels 段已删除 — ModelRegistry._load_file 不解析
# 该 key (只读 models/task_routes/agent_routes), 留着会造成"配置了却不
# 生效"的假象。任务风险等级仍以 client.py 的 TASK_RISK_LEVELS 为真相;
# 待 ModelRegistry 增加 get_task_risk_level() API 后再迁回此处。
