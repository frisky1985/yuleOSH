[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yuleosh"
version = "4.1.0"
description = "嵌入式AI开发全流程平台 — OpenSpec+Superpowers+Harness Engineering 三位一体"
authors = [{name = "frisky1985"}]
license = {text = "Elastic-2.0"}
requires-python = ">=3.12,<3.14"
readme = "README.md"
dependencies = [
    "pyyaml>=6.0",
    "msgpack>=1.2.1",  # GHSA-6v7p-g79w-8964
    "starlette>=1.3.0",  # PYSEC-2026-161
    "click>=8.3.3",  # PYSEC-2026-2132
    "pillow>=12.3.0",  # Multiple CVEs
    "setuptools>=83.0.0",  # PYSEC-2026-3447
    "jinja2>=3.1.0",
    "openpyxl>=3.1.0",  # evidence/excel_writer.py 依赖（此前未声明导致 CI 干净环境 18 个测试失败）
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Elastic License 2.0",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/frisky1985/yuleOSH"
Repository = "https://github.com/frisky1985/yuleOSH"

[project.optional-dependencies]
# P2-2: SaaS 多租户功能（认证/计费/PostgreSQL/串口硬件）。
# 纯 CLI 用户: pip install yuleosh
# SaaS 部署:   pip install "yuleosh[saas]"
# 开发测试:   pip install -e ".[dev]"
saas = ["bcrypt>=5.0", "pyjwt>=2.13.0", "psycopg2-binary>=2.9", "pyserial>=3.5", "stripe>=15.0"]
# P1-1: pytest-cov 支撑 pytest.ini addopts 的 --cov 参数（未安装时 pytest 会报
# "unrecognized arguments: --cov=..."）。安装: pip install -e ".[dev]"
dev = ["pytest", "pytest-cov>=4.1.0", "pytest-mock", "pytest-asyncio>=0.23", "pytest-randomly>=4.0"]
all = ["yuleosh[saas,dev]"]

[project.scripts]
yuleosh = "yuleosh._entry:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yuleosh = [
    "ci/rulesets/misra-rules.yaml",
    "templates/ecus/*/template.yaml",
    "templates/ecus/*/*.j2",
    "templates/ecus/*/**/*.j2",
]

[tool.setuptools]
include-package-data = true

[tool.coverage.run]
source = ["yuleosh"]
branch = true
omit = [
    "src/yuleosh/templates/*",       # Jinja2 模板文件，非逻辑代码
    "src/yuleosh/sil/*",             # 依赖真实串口硬件，无法在 CI mock；见 P1-3b
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "raise ImportError",
    "except ImportError",
    "def _get_secret",
    "def main",
    "def _check_llm_key",
]
fail_under = 60   # P0-2: 与 ci.yml "Coverage gate (fail-under 60)" 保持一致。
                  # 本地跑全量测试时此值生效；子集运行用 pytest.ini addopts 的 --cov-fail-under=5。
                  # 提阈计划: 待实绩稳定后升至 80（见 TASK_STATUS P0-2b）。
show_missing = true
